name: 🎬 Genera Video Reel Immobile (Colonna F + Card Grafica 9:16 + Invio Email)

on:
  workflow_dispatch:
    inputs:
      riga_foglio:
        description: 'Numero riga Google Sheets da elaborare (default: 2)'
        required: true
        default: '2'
      email_destinatario:
        description: 'Email destinatario (default: giancaniimmobiliare@gmail.com)'
        required: true
        default: 'giancaniimmobiliare@gmail.com'
      video_drive_id:
        description: 'ID o URL Google Drive del video immobile (opzionale)'
        required: false
        default: ''
      musica_drive_id:
        description: 'ID o URL Google Drive della traccia musicale (opzionale)'
        required: false
        default: ''
      forza_testo_colonna_f:
        description: 'Testo alternativo Colonna F (se vuoi testare senza aprire il foglio)'
        required: false
        default: ''

  repository_dispatch:
    types: [genera_reel_immobile]

concurrency:
  group: genera-reel-immobile
  cancel-in-progress: false

jobs:
  crea-e-invia-reel:
    runs-on: ubuntu-latest
    name: 🚀 Rendering Reel 9:16 & Spedizione Email
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Installa FFmpeg e Font di Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-freefont-ttf

      - name: 📦 Installa Dipendenze Python
        run: |
          pip install --no-cache-dir requests pillow imageio-ffmpeg urllib3

      - name: 🎬 Esegui Generazione Video Reel & Invio Email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'giancaniimmobiliare@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.GMAIL_APP_PASSWORD }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          RIGA_INPUT: ${{ github.event.inputs.riga_foglio || github.event.client_payload.riga_foglio || '2' }}
          EMAIL_INPUT: ${{ github.event.inputs.email_destinatario || github.event.client_payload.email_destinatario || 'giancaniimmobiliare@gmail.com' }}
          VIDEO_INPUT: ${{ github.event.inputs.video_drive_id || github.event.client_payload.video_drive_id || '' }}
          MUSICA_INPUT: ${{ github.event.inputs.musica_drive_id || github.event.client_payload.musica_drive_id || '' }}
          TESTO_INPUT: ${{ github.event.inputs.forza_testo_colonna_f || github.event.client_payload.forza_testo_colonna_f || '' }}
        run: |
          python genera_reel_immobile.py \
            --row "$RIGA_INPUT" \
            --email "$EMAIL_INPUT" \
            --video "$VIDEO_INPUT" \
            --music "$MUSICA_INPUT" \
            --text "$TESTO_INPUT"

      - name: 💾 Archivia Video Generato nei Download di GitHub Actions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-reel-immobile-giancani
          path: video_storie_output/*.mp4
          retention-days: 14

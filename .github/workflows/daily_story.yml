name: 🎬 Bot Reels Multi-Modalità (Mitologia 18:00, Bibbia 20:00, Grandi Classici, Pillole 06:00)

on:
  # Esecuzione automatica giornaliera:
  # - Ore 02:30 italiane (00:30 UTC): Generazione notturna a quote azzerate
  # - Ore 06:00 italiane (04:00 UTC): Pillole Immobiliari & Legali
  # - Ore 18:00 italiane (16:00 UTC): Storie della Mitologia Greca
  # - Ore 20:00 italiane (18:00 UTC): Storie della Bibbia & Grandi Classici
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 16 * * *'
    - cron: '0 18 * * *'

  # Trigger manuale per test immediato dalla dashboard di GitHub o dalla Regia Generator
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità bot (mitologia = 18:00 Miti Greci, bibbia = 20:00 Bibbia, standard = Libri, pillole = 06:00)'
        required: false
        default: 'mitologia'
        type: choice
        options:
          - mitologia
          - bibbia
          - standard
          - pillole
      story_id:
        description: 'ID specifico della storia o pillola (lascia vuoto per rotazione giornaliera)'
        required: false
        default: ''
      voice:
        description: 'Voce Edge-TTS personalizzata (lascia vuoto per voce ottimale di rubrica)'
        required: false
        default: ''
        type: choice
        options:
      solo_telegram:
        description: 'Invia solo ed esclusivamente su Telegram (nessuna pubblicazione social)'
        required: false
        default: true
        type: boolean

jobs:
  genera_e_pubblica_video:
    runs-on: ubuntu-latest
    name: 🎬 Genera Video Verticale e Invia su Telegram
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎞️ Installa FFmpeg e Font di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf fonts-liberation

      - name: 📦 Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Esecuzione Pipeline Bot Reels Multi-Modalità
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ACCESS_TOKEN_ANTONIO: ${{ secrets.FB_PAGE_ACCESS_TOKEN_ANTONIO }}
          FB_PAGE_ACCESS_TOKEN_GIANCANI: ${{ secrets.FB_PAGE_ACCESS_TOKEN_GIANCANI }}
          FB_PAGE_ID_GIANCANI: ${{ secrets.FB_PAGE_ID_GIANCANI || '234931856561526' }}
          FB_PAGE_ACCESS_TOKEN_ETERNO: ${{ secrets.FB_PAGE_ACCESS_TOKEN_ETERNO }}
          FB_PAGE_ID_ETERNO: ${{ secrets.FB_PAGE_ID_ETERNO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YOUTUBE_TOKEN_MITOLOGIA_JSON: ${{ secrets.YOUTUBE_TOKEN_MITOLOGIA_JSON }}
          YOUTUBE_TOKEN_BIBBIA_JSON: ${{ secrets.YOUTUBE_TOKEN_BIBBIA_JSON }}
          YOUTUBE_TOKEN_GIANCANI_JSON: ${{ secrets.YOUTUBE_TOKEN_GIANCANI_JSON }}
        run: |
          CMD="python bot_reels_master.py"
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            CMD="$CMD --mode ${{ github.event.inputs.mode }}"
          fi
          if [ -n "${{ github.event.inputs.story_id }}" ]; then
            CMD="$CMD --id ${{ github.event.inputs.story_id }}"
          fi
          if [ -n "${{ github.event.inputs.voice }}" ]; then
            CMD="$CMD --voice ${{ github.event.inputs.voice }}"
          fi
          if [ "${{ github.event.inputs.solo_telegram }}" = "true" ]; then
            CMD="$CMD --solo-telegram"
          fi
          echo "Esecuzione comando: $CMD"
          $CMD

      - name: 💾 Salva lo Stato di Rotazione Progressiva Storie
        if: always()
        run: |
          git config --global user.name "Giancani Bot Cloud"
          git config --global user.email "bot@immobiliaregiancani.it"
          git add stato_rotazione_*.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Aggiornato stato rotazione progressiva storie [skip ci]" && git push)

      - name: 💾 Archivia Video Generato come Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-reels-generato
          path: video_storie_output/*.mp4
          retention-days: 7

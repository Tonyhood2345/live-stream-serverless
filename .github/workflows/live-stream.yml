name: 🔴 Diretta Serale DarIA Multistream (Ore 19:00) — YouTube, Facebook, TikTok & Instagram

on:
  schedule:
    # 🌆 DIRETTA SERALE DARIA ORE 19:00 (Europe/Rome):
    # Inizializzazione 5 minuti prima per riscaldamento browser, audio e connessioni RTMP (Zero Spreco Minuti):
    # ❄️ Orario Solare / Inverno (CET, UTC+1): ore 18:55 Roma -> 17:55 UTC
    - cron: '55 17 * * *'
    # ☀️ Orario Legale / Estate (CEST, UTC+2): ore 18:55 Roma -> 16:55 UTC
    - cron: '55 16 * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video o della Web App'
        required: false
        default: 'https://tonyhood2345.github.io/live-stream-serverless/orizzontale.html'
      fb_key:
        description: 'Facebook RTMP URL completo o Stream Key'
        required: false
        default: '' 
      yt_key:
        description: 'YouTube Stream Key o URL RTMP completo'
        required: false
        default: '055j-3cje-m4jg-9zzj-bs7s'
      tk_key:
        description: 'TikTok RTMP URL completo o Stream Key'
        required: false
        default: '' 
      ig_key:
        description: 'Instagram RTMP URL completo'
        required: false
      duration_hours:
        description: 'Durata massima della diretta serale in ore (default 1.1 ore = 65 minuti per zero spreco minuti)'
        required: false
        default: '1.1'
      stream_quality:
        description: 'Qualità stream (1080p_high, 1080p_std, 1080p_eco, 720p_hq, 720p_std, 720p_eco, 480p, custom)'
        required: false
        default: '1080p_std'
      scale_factor:
        description: 'Scala Device Chrome (1.0 = Desktop 1:1, 1.25/1.5 = Zoom)'
        required: false
        default: '1.0'
      custom_bitrate:
        description: 'Bitrate FFmpeg personalizzato (es. 4000k)'
        required: false
        default: '4500k'
      custom_res:
        description: 'Risoluzione personalizzata (es. 1920:1080)'
        required: false
        default: '1920:1080'

concurrency:
  group: live-multistream-perpetual
  cancel-in-progress: true

jobs:
  multistream:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Time-Guard & Analisi Canali (Europe/Rome)
        id: timeguard
        run: |
          ROME_HOUR=$(TZ='Europe/Rome' date +%H)
          ROME_MIN=$(TZ='Europe/Rome' date +%M)
          echo "⏰ [Controllo Orario] Ora a Roma: $ROME_HOUR:$ROME_MIN (Evento: ${{ github.event_name }})"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Consente l'avvio serale nella finestra 18:00 - 21:30 ora di Roma (gestisce cambi DST e code GitHub Actions)
            if [ "$ROME_HOUR" -ge 18 ] && [ "$ROME_HOUR" -le 21 ]; then
              echo "✅ Finestra Diretta Serale Ore 19:00 confermata ($ROME_HOUR:$ROME_MIN Europe/Rome)!"
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "⏭️ Trigger cron fuori finestra serale 18:00-21:30 ($ROME_HOUR:$ROME_MIN Europe/Rome). Salto esecuzione."
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "🚀 Avvio manuale (workflow_dispatch): esecuzione immediata!"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

          echo "yt_enabled=true" >> $GITHUB_OUTPUT
          echo "social_enabled=true" >> $GITHUB_OUTPUT

      - name: Setup Headless Environment and Audio Engine
        if: steps.timeguard.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb openbox pulseaudio pulseaudio-utils alsa-utils jq curl fonts-dejavu-core espeak-ng speech-dispatcher libespeak-ng1
          if ! command -v google-chrome &> /dev/null; then
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version
          ffmpeg -version | head -1

      - name: Setup Playwright and Headless Automation Engines
        if: steps.timeguard.outputs.should_run == 'true'
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps
          npx playwright install chromium
          python3 -m pip install --no-cache-dir playwright requests pillow numpy edge-tts yt-dlp
          python3 -m playwright install --with-deps chromium || true

      - name: Launch Audio Engine, Browser and Start Multistream
        if: steps.timeguard.outputs.should_run == 'true'
        run: |
          # 1. Configura PulseAudio con socket UNIX esplicito
          mkdir -p /tmp/pulse-config
          cat << 'EOF' > /tmp/pulse.pa
          load-module module-native-protocol-unix socket=/tmp/pulse-socket
          load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink
          set-default-sink VirtualSink
          EOF

          pulseaudio -D --exit-idle-time=-1 -F /tmp/pulse.pa || true
          sleep 2

          export PULSE_SERVER=unix:/tmp/pulse-socket
          export DISPLAY=:99

          # Configura ALSA per reindirizzare a PulseAudio
          cat << 'EOF' > ~/.asoundrc
          pcm.!default {
              type pulse
          }
          ctl.!default {
              type pulse
          }
          EOF

          # 2. Server X virtuale 1920x1080
          Xvfb :99 -screen 0 1920x1080x24 &
          openbox &
          sleep 2

          # 3. Avvia Microservizio Locale Edge TTS per DarIA e DarIO (Porta 5050)
          echo "Avvio microservizio Edge TTS locale su porta 5050..."
          python3 scripts/tts_server.py &
          sleep 3
          curl -s http://127.0.0.1:5050/health && echo " -> TTS Server OK!" || echo " -> Avviso TTS Server"

          # 4. CREA ESTENSIONE CHROME ANTI-BANNER GOOGLE APPS SCRIPT
          mkdir -p /tmp/hide_banner_ext
          cat << 'EOF' > /tmp/hide_banner_ext/manifest.json
          {
            "manifest_version": 3,
            "name": "Hide Apps Script Banner",
            "version": "1.0",
            "content_scripts": [
              {
                "matches": ["*://script.google.com/*", "*://script.googleusercontent.com/*"],
                "css": ["style.css"],
                "js": ["content.js"],
                "run_at": "document_start"
              }
            ]
          }
          EOF
          cat << 'EOF' > /tmp/hide_banner_ext/style.css
          #warning,
          .warning-bar,
          #warning-bar-table tr:first-child,
          #warning-bar-table > tbody > tr:first-child,
          .docs-butter-bar-container,
          div[aria-label*="Apps Script"],
          .app-bar,
          #guest-banner {
            display: none !important;
            height: 0px !important;
            max-height: 0px !important;
            min-height: 0px !important;
            padding: 0 !important;
            margin: 0 !important;
            border: 0 !important;
            overflow: hidden !important;
            visibility: hidden !important;
          }
          #warning-bar-table,
          #warning-bar-table > tbody,
          #warning-bar-table > tbody > tr:last-child,
          #warning-bar-table > tbody > tr:last-child > td,
          #sandboxFrame {
            height: 100% !important;
            width: 100% !important;
            min-height: 100vh !important;
            min-width: 100vw !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
          }
          html, body {
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
          }
          EOF
          cat << 'EOF' > /tmp/hide_banner_ext/content.js
          (function() {
            function removeBanner() {
              var w = document.getElementById('warning');
              if (w) {
                w.style.setProperty('display', 'none', 'important');
                if (w.parentElement && w.parentElement.parentElement) {
                  w.parentElement.parentElement.style.setProperty('display', 'none', 'important');
                }
              }
              var tbl = document.getElementById('warning-bar-table');
              if (tbl) {
                var rows = tbl.querySelectorAll('tr');
                if (rows.length > 1) {
                  rows[0].style.setProperty('display', 'none', 'important');
                }
              }
              var iframe = document.getElementById('sandboxFrame');
              if (iframe) {
                iframe.style.setProperty('height', '100vh', 'important');
                iframe.style.setProperty('width', '100vw', 'important');
                iframe.style.setProperty('border', 'none', 'important');
              }
            }
            removeBanner();
            document.addEventListener('DOMContentLoaded', removeBanner);
            window.addEventListener('load', removeBanner);
            setInterval(removeBanner, 300);
          })();
          EOF

          mkdir -p /tmp/chrome_clean_profile
          touch "/tmp/chrome_clean_profile/First Run"
          SCALE_FACTOR="${{ github.event.inputs.scale_factor }}"
          if [ -z "$SCALE_FACTOR" ]; then SCALE_FACTOR="1.0"; fi
          VIDEO_URL="${{ github.event.inputs.video_url }}"
          if [ -z "$VIDEO_URL" ]; then
            VIDEO_URL="https://tonyhood2345.github.io/live-stream-serverless/orizzontale.html"
          fi
          echo "Avvio Chrome con Scala $SCALE_FACTOR e Anti-Banner su: $VIDEO_URL"
          google-chrome \
            --kiosk \
            --window-position=0,0 \
            --window-size=1920,1080 \
            --force-device-scale-factor=$SCALE_FACTOR \
            --enable-extensions \
            --load-extension=/tmp/hide_banner_ext \
            --disable-extensions-except=/tmp/hide_banner_ext \
            --remote-debugging-port=9222 \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-gl=swiftshader \
            --disable-web-security \
            --allow-running-insecure-content \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-first-run-ui \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-restore-session-state \
            --disable-notifications \
            --disable-features=AudioServiceOutOfProcess \
            --enable-features=UsePulseAudio \
            --autoplay-policy=no-user-gesture-required \
            --alsa-output-device=pulse \
            --user-data-dir=/tmp/chrome_clean_profile \
            "$VIDEO_URL" &

          echo "Attesa di 10 secondi per il caricamento della pagina..."
          sleep 10
          echo "🔍 Verifica processi Chrome attivi:"
          ps aux | grep -i chrome || true
          echo "📸 Frame di verifica X11 su display :99 per confermare rendering:"
          ffmpeg -y -f x11grab -video_size 1920x1080 -i :99 -vframes 1 /tmp/frame_verifica.png || true
          ls -lh /tmp/frame_verifica.png || true
          echo "Verifica sink inputs PulseAudio (Chrome Audio Output):"
          pactl list sink-inputs || true

          # 5. Configurazione Destinazioni RTMP
          TEE_DESTS=()

          # --- DESTINAZIONE 1: YOUTUBE LIVE (24 ORE SU 24 INFINITO) ---
          YT_KEY="${{ github.event.inputs.yt_key }}"
          if [ -z "$YT_KEY" ]; then
            YT_KEY="055j-3cje-m4jg-9zzj-bs7s"
          fi
          YT_URL=""
          if [[ "$YT_KEY" == rtmp* ]]; then
            YT_URL="$YT_KEY"
          else
            YT_URL="rtmp://a.rtmp.youtube.com/live2/$YT_KEY"
          fi
          echo "▶️ [YouTube Live] Destinazione 24H Attiva: $YT_URL"
          TEE_DESTS+=("[f=flv:onfail=ignore]${YT_URL}")

          # --- AVVIO ESTRAZIONE CHIAVI MULTISTREAM (FACEBOOK, TIKTOK, INSTAGRAM) ---
          if [ -f scripts/estrai_chiavi_live_social.py ]; then
            echo "🤖 Avvio Bot Estrazione Chiavi Multistream (Facebook, TikTok, Instagram)..."
            python3 -u scripts/estrai_chiavi_live_social.py --headless &
            echo "⏳ In attesa aggiornamento coordinate social dinamiche (max 30s)..."
            for i in $(seq 1 15); do
              if [ -f /tmp/instagram_rtmp.txt ]; then
                echo "📸 Endpoint dinamico Instagram Live rilevato in $((i*2))s!"
                break
              fi
              sleep 2
            done
          fi

          # --- DESTINAZIONE 2: FACEBOOK LIVE (OBBLIGATORIO - ORE 19:00) ---
          echo "📘 [Facebook Live] Creazione obbligatoria sessione Live via Meta Graph API..."
          export FB_PAGE_TOKEN="EAAZAH7q8wRZAEBS3ZAfEIpFIcXPJ87gDZAY8QjpGvBSjgC44c22JVeZAiDxMOM85JRMKM2T1hLgekBCkT0z5geNsb3KxAhMr7W7xlOGVKJsdKV9rZCEKLupIy1uNaDkVZAXmFtn0stiB212odWJ2ZCZBtlWkZAzy5wmPfKyZC3g27g6RXs0FK2GiYc5MeqaZCZBuoYjIyreTZAxwOqtfESifVw"
          export FB_PAGE_ID="234931856561526"
          python3 scripts/crea_diretta_facebook_dinamica.py || true

          FB_KEY=""
          if [ -f /tmp/facebook_rtmp.txt ]; then
            FB_KEY=$(cat /tmp/facebook_rtmp.txt | tr -d '\r\n')
          elif [ -f facebook_rtmp.txt ]; then
            FB_KEY=$(cat facebook_rtmp.txt | tr -d '\r\n')
          elif [ -n "${{ github.event.inputs.fb_key }}" ] && [[ "${{ github.event.inputs.fb_key }}" != *"FB-1761836115505207"* ]]; then
            FB_KEY="${{ github.event.inputs.fb_key }}"
          fi

          if [ -z "$FB_KEY" ]; then
            echo "⚠️ [Facebook Live] Tentativo endpoint secondario permanente..."
            FB_KEY="rtmps://live-api-s.facebook.com:443/rtmp/FB-234931856561526-live-now"
          fi

          if [ -n "$FB_KEY" ]; then
            FB_URL=""
            if [[ "$FB_KEY" == rtmp* ]]; then
              FB_URL="$FB_KEY"
            else
              FB_URL="rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
            fi
            echo "📘 [Facebook Live] Destinazione OBBLIGATORIA ATTIVA (Ore 19:00): $FB_URL"
            TEE_DESTS+=("[f=flv:onfail=ignore]${FB_URL}")

            # Avvia demone storie in diretta ogni 30 min (Facebook)
            echo "📱 Avvio demone Storie Social in diretta ogni 30 minuti..."
            python3 scripts/pubblica_storia_facebook.py --mode live --loop --interval 1800 &
          fi

          # --- DESTINAZIONE 3: TIKTOK LIVE ---
          TK_KEY="${{ github.event.inputs.tk_key }}"
          if [ -f /tmp/tiktok_rtmp.txt ]; then
            TK_KEY=$(cat /tmp/tiktok_rtmp.txt | tr -d '\r\n')
          fi
          if [ -n "$TK_KEY" ]; then
            TK_URL=""
            if [[ "$TK_KEY" == rtmp* ]]; then
              TK_URL="$TK_KEY"
            else
              TK_URL="rtmp://live-push.tiktok-cdns.com/live/$TK_KEY"
            fi
            echo "🎵 [TikTok Live] Destinazione Attiva: $TK_URL"
            TEE_DESTS+=("[f=flv:onfail=ignore]${TK_URL}")
          fi

          # --- DESTINAZIONE 4: INSTAGRAM LIVE ---
          IG_KEY="${{ github.event.inputs.ig_key }}"
          if [ -f /tmp/instagram_rtmp.txt ]; then
            IG_KEY=$(cat /tmp/instagram_rtmp.txt | tr -d '\r\n')
          fi
          if [ -n "$IG_KEY" ]; then
            IG_URL=""
            if [[ "$IG_KEY" == rtmp* ]]; then
              IG_URL="$IG_KEY"
            else
              IG_URL="rtmps://live-upload.instagram.com:443/rtmp/$IG_KEY"
            fi
            echo "📸 [Instagram Live] Destinazione Attiva: $IG_URL"
            TEE_DESTS+=("[f=flv:onfail=ignore]${IG_URL}")
          fi

          if [ ${#TEE_DESTS[@]} -eq 0 ]; then
            echo "❌ Errore: Nessuna destinazione RTMP configurata!"
            exit 1
          fi

          IFS="|"
          TEE_STRING="${TEE_DESTS[*]}"

          DUR_HOURS="${{ github.event.inputs.duration_hours }}"
          if [ -z "$DUR_HOURS" ]; then DUR_HOURS="1.1"; fi
          DUR_SECS=$(awk "BEGIN {print int($DUR_HOURS * 3600)}")
          echo "⏱️ Durata prevista per questa sessione staffetta: $DUR_HOURS ore ($DUR_SECS secondi)"

          QUALITY="${{ github.event.inputs.stream_quality }}"
          if [ -z "$QUALITY" ]; then QUALITY="1080p_std"; fi
          if [ "$QUALITY" = "1080p_high" ]; then
            BITRATE="6000k"; MINRATE="5000k"; MAXRATE="6500k"; BUFSIZE="12000k"; VF="scale=1920:1080:flags=lanczos"
          elif [ "$QUALITY" = "1080p_eco" ]; then
            BITRATE="3500k"; MINRATE="3000k"; MAXRATE="4000k"; BUFSIZE="7000k"; VF="scale=1920:1080:flags=bicubic"
          elif [ "$QUALITY" = "720p_hq" ]; then
            BITRATE="3000k"; MINRATE="2600k"; MAXRATE="3400k"; BUFSIZE="6000k"; VF="scale=1280:720:flags=bicubic"
          elif [ "$QUALITY" = "720p_std" ]; then
            BITRATE="2200k"; MINRATE="1800k"; MAXRATE="2600k"; BUFSIZE="4400k"; VF="scale=1280:720:flags=bicubic"
          elif [ "$QUALITY" = "720p_eco" ]; then
            BITRATE="1600k"; MINRATE="1300k"; MAXRATE="2000k"; BUFSIZE="3200k"; VF="scale=1280:720:flags=bicubic"
          elif [ "$QUALITY" = "480p" ]; then
            BITRATE="1000k"; MINRATE="800k"; MAXRATE="1200k"; BUFSIZE="2000k"; VF="scale=854:480:flags=bicubic"
          else
            BITRATE="4500k"; MINRATE="4000k"; MAXRATE="5000k"; BUFSIZE="9000k"; VF="scale=1920:1080:flags=lanczos"
          fi
          echo "🚀 FFmpeg Config: Bitrate=$BITRATE ($QUALITY), Filtro=$VF"

          echo "🎥 Avvio encoding FFmpeg CBR $BITRATE verso YouTube 24H (+ Social)..."
          timeout --kill-after=30s "${DUR_SECS}s" ffmpeg -thread_queue_size 2048 \
            -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
            -thread_queue_size 2048 \
            -f pulse -i VirtualSink.monitor \
            -vf "$VF" \
            -c:v libx264 -preset veryfast \
            -b:v $BITRATE -minrate $MINRATE -maxrate $MAXRATE -bufsize $BUFSIZE \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 160k -ar 44100 -ac 2 \
            -vsync cfr \
            -flags +global_header \
            -f tee -map 0:v -map 1:a "$TEE_STRING" || true

          echo "🏁 Turno di trasmissione completato con successo. Passaggio alla staffetta successiva! — Immobiliare Giancani"

      - name: 🔒 Chiusura Regolare Diretta Serale (Zero Consumo Minuti)
        if: always()
        run: |
          echo "🏁 Diretta serale delle ore 19:00 di DarIA completata regolarmente!"
          echo "🔒 Runner arrestato alle ore 20:00: nessuna staffetta avviata per azzerare il consumo di minuti e server."
          echo "— Immobiliare Giancani"

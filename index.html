<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Immobiliare Giancani — Live TV 24/7</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #041d3d; color: #fff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  </style>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var regia = params.get('regia');
      var formato = (params.get('formato') || '').toLowerCase();
      var target = 'verticale.html';
      if (regia === '1' || regia === 'true' || formato === 'regia') {
        target = 'regia.html';
      } else if (formato === 'orizzontale' || formato === '16:9' || formato === 'tv' || formato === 'landscape') {
        target = 'orizzontale.html';
      }
      var qs = window.location.search || '';
      window.location.replace(target + qs);
    })();
  </script>
</head>
<body></body>
</html>

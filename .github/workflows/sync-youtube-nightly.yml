name: Sync YouTube Videos & Shorts Nightly (22:00 IT)

on:
  schedule:
    # 20:00 UTC = 22:00 CEST (Ora Legale Italiana)
    - cron: '0 20 * * *'
    # 21:00 UTC = 22:00 CET (Ora Solare Italiana)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  sync-youtube:
    runs-on: ubuntu-latest
    name: Sincronizzazione Notturna YouTube (22:00)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze (yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Esegui Sincronizzazione Canale YouTube
        env:
          GAS_WEBAPP_URL: "https://script.google.com/macros/s/AKfycbwTAyOTWpm3mNGX-DAWbZ7XOtrog52md5-P_jUEHoEhsoXCrJGj_bLClOiDvo5FKUbpWg/exec"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/sync_youtube_videos.py

name: 🎵 Bot TikTok Automatico — Immobiliare Giancani

on:
  # Schedulazione automatica quotidiana negli orari a massimo engagement su TikTok
  schedule:
    # 🕛 Slot Pranzo: ore 12:30 italiane (11:30 UTC)
    - cron: '30 11 * * *'
    # 🌆 Slot Preserale: ore 18:30 italiane (17:30 UTC)
    - cron: '30 17 * * *'

  # Trigger manuale e da Webhook / REST API / Apps Script per ripubblicazione immediata
  workflow_dispatch:
    inputs:
      story_id:
        description: 'ID specifico della pillola/immobile dal database'
        required: false
        default: ''
      video_url:
        description: 'URL del video YouTube o MP4 da scaricare e ripubblicare'
        required: false
        default: ''
      foto_url:
        description: 'URL della foto immobile per generazione clip 9:16'
        required: false
        default: ''
      titolo:
        description: 'Titolo annuncio o video'
        required: false
        default: ''
      superficie:
        description: 'Superficie in metri quadri'
        required: false
        default: ''
      prezzo:
        description: 'Prezzo immobile'
        required: false
        default: ''
      descrizione:
        description: 'Descrizione annuncio rigorosamente da Colonna F'
        required: false
        default: ''
      force:
        description: 'Forza la pubblicazione anche se già pubblicato oggi'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  pubblica_tiktok:
    runs-on: ubuntu-latest
    name: 🎵 Caricamento Video su TikTok (@immobiliare_giancani)
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installa Dipendenze, ffmpeg, yt-dlp & Browser Chromium Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests urllib3 playwright pillow yt-dlp
          playwright install --with-deps chromium

      - name: 🚀 Esecuzione Bot TikTok Publisher (Colonna F & Branding)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
          INPUT_STORY_ID: ${{ github.event.inputs.story_id }}
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
          INPUT_FOTO_URL: ${{ github.event.inputs.foto_url }}
          INPUT_TITOLO: ${{ github.event.inputs.titolo }}
          INPUT_SUPERFICIE: ${{ github.event.inputs.superficie }}
          INPUT_PREZZO: ${{ github.event.inputs.prezzo }}
          INPUT_DESCRIZIONE: ${{ github.event.inputs.descrizione }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 scripts/bot_tiktok_publisher.py

      - name: 💾 Salva Cronologia Pubblicazioni su GitHub
        if: always()
        run: |
          git config --global user.name "Giancani TikTok Bot"
          git config --global user.email "bot@immobiliaregiancani.it"
          git add scripts/immobili_pubblicati_history.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: Aggiornata cronologia pubblicazioni TikTok [skip ci]" && git push)

      - name: 📸 Archivia Screenshot di Conferma TikTok come Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-conferma-pubblicazione
          path: video_storie_output/*.png
          retention-days: 7

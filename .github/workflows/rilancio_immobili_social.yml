name: 🤖 Bot Rilancio Immobili Social (Archivio)

on:
  schedule:
    # Esecuzione quotidiana alle 13:00 italiane (12:00 UTC)
    - cron: '0 12 * * *'
    # Seconda verifica serale alle 18:00 italiane (17:00 UTC) se ancora nulla è stato pubblicato
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza la proposta di rilancio anche se oggi è già stato pubblicato un post (true/false)'
        required: false
        default: 'false'

jobs:
  rilancio_immobili:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurazione Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installazione Dipendenze
        run: |
          pip install --upgrade pip
          pip install requests urllib3

      - name: 🚀 Esecuzione Bot Rilancio Social
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_API_TOKEN: ${{ secrets.WP_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/bot_rilancio_immobili_social.py --force
          else
            python scripts/bot_rilancio_immobili_social.py
          fi

      - name: 💾 Commit & Push Aggiornamento Indice Rotazione
        run: |
          git config --local user.email "bot@immobiliaregiancani.it"
          git config --local user.name "Bot Immobiliare Giancani"
          git add scripts/data/last_reposted_index.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: aggiornato indice rotazione rilancio immobili [skip ci]" && git push)

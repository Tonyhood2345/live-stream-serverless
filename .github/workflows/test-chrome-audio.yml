name: Test Chrome PulseAudio Capture

on:
  workflow_dispatch:

jobs:
  test-chrome-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Audio and Browser
        run: |
          sudo apt-get update && sudo apt-get install -y pulseaudio pulseaudio-utils alsa-utils ffmpeg xvfb openbox
          mkdir -p /tmp/pulse-config
          cat << 'EOF' > /tmp/pulse.pa
          load-module module-native-protocol-unix socket=/tmp/pulse-socket
          load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink
          set-default-sink VirtualSink
          EOF
          pulseaudio -D --exit-idle-time=-1 -F /tmp/pulse.pa || true
          sleep 2
          echo "PulseAudio setup complete!"
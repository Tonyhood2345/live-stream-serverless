  function convertiUrlDriveDirect(url, isAudio) {
    if (!url || typeof url !== 'string') return '';
    url = url.trim();
    if (!url) return '';
    
    // Se è un URL diretto già pronto (GitHub raw, https audio, ecc.)
    if (url.startsWith('https://raw.githubusercontent.com') || url.indexOf('/assets/musica/') !== -1) {
      return url;
    }

    var isAudioFile = isAudio || /\.mp3|\.wav|\.ogg|\.m4a/i.test(url);
    
    // Se è un ID file nudo di Google Drive
    if (url.length >= 25 && url.length <= 50 && !url.startsWith('http') && /^[a-zA-Z0-9_-]+$/.test(url)) {
      if (isAudioFile) return 'https://drive.google.com/uc?export=download&id=' + url;
      return 'https://lh3.googleusercontent.com/d/' + url;
    }
    
    if (url.indexOf('drive.google.com') !== -1 || url.indexOf('docs.google.com') !== -1) {
      var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        if (isAudioFile) return 'https://drive.google.com/uc?export=download&id=' + match[1];
        return 'https://lh3.googleusercontent.com/d/' + match[1];
      }
    }
    return url;
  }

  function isVirtualBrowser() {
    try {
      if (navigator.webdriver) return true;
      var ua = navigator.userAgent || '';
      if (/HeadlessChrome|Electron|PhantomJS|Restream|StreamYard|Cloud|Virtual|Linux.*X11/i.test(ua)) return true;
      var canvas = document.createElement('canvas');
      var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return true;
      var dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        var renderer = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
        if (renderer.indexOf('swiftshader') !== -1 || renderer.indexOf('llvmpipe') !== -1 || renderer.indexOf('software') !== -1 || renderer.indexOf('mesa') !== -1 || renderer.indexOf('microsoft basic') !== -1) {
          return true;
        }
      }
    } catch(e) {
      return true;
    }
    return false;
  }

        if (viewer360) {

        // 🎲 ORIZZONTI DINAMICI: ogni volta che una foto 360 va in onda, parte da un quadrante casuale (0°, 90°, 180°, 270°)
        var angoliOrizzonte = [0, 90, 180, 270];
        var randomYaw = angoliOrizzonte[Math.floor(Math.random() * angoliOrizzonte.length)];

        viewer360 = pannellum.viewer('panorama-360-container', {
          type: 'equirectangular',

          autoRotate: -2.2,

          showControls: false,

      if (imgContainer) {
        imgContainer.className = getClasseAnimazione360(modalita360Attiva);
        imgContainer.style.animation = '';
        imgContainer.style.backgroundPosition = '';
      }
    } else if (action === 'stop') {
      if (viewer360) { try { viewer360.stopAutoRotate(); } catch(e){} }
      if (timerTourPersonalizzato) { clearInterval(timerTourPersonalizzato); timerTourPersonalizzato = null; }
      if (imgContainer) {
        var computedStyle = window.getComputedStyle(imgContainer);
        var currentBgPos = computedStyle.backgroundPosition;
        imgContainer.style.animation = 'none';
        imgContainer.style.backgroundPosition = currentBgPos;
      }
    } else if (action === 'start') {
      if (viewer360) { try { viewer360.startAutoRotate(-4.0); } catch(e){} }
      if (imgContainer) {
        imgContainer.className = getClasseAnimazione360('giro');
        imgContainer.style.animation = '';
      }
    } else if (action === 'set_mode' || action === 'modalita') {
      modalita360Attiva = val || 'giro';
      if (imgContainer) {
        imgContainer.style.animation = '';
        imgContainer.className = getClasseAnimazione360(modalita360Attiva);

      if (viewer360) {

          viewer360.setPitch(-90);
          viewer360.setHfov(120);

            if (viewer360) { viewer360.setPitch(0); viewer360.setHfov(90); }

          viewer360.setPitch(0);

          viewer360.stopAutoRotate();
        } else if (modalita360Attiva === 'giro') {
          viewer360.setPitch(0);
          viewer360.setHfov(90);
          viewer360.startAutoRotate(-4.0);
        } else if (modalita360Attiva === 'drone') {
          viewer360.setHfov(80);
          viewer360.startAutoRotate(-2.5);
        }

  function eseguiPercorsoTour360(tappe) {
    var listaTappe = tappe;
    if (!listaTappe || !Array.isArray(listaTappe) || listaTappe.length === 0) {
      listaTappe = [
        { nome: 'Ingresso', yaw: 0, pitch: 0, zoom: 200 },
        { nome: 'Soggiorno & Finestre', yaw: 90, pitch: 10, zoom: 260 },
        { nome: 'Cucina & Finiture', yaw: 180, pitch: -10, zoom: 300 },
        { nome: 'Vista Panoramica Totale', yaw: 270, pitch: 0, zoom: 160 }
      ];
    }
    const imgContainer = document.getElementById('image-container');
    if (imgContainer) {
      imgContainer.className = 'media-container image-container anim-360-tour';
    }
    if (viewer360) {
      if (timerTourPersonalizzato) clearInterval(timerTourPersonalizzato);
      var idx = 0;
      function proseguiTappa() {
        if (!viewer360 || idx >= listaTappe.length) {
          idx = 0;
        }
        var t = listaTappe[idx];
        if (t && viewer360) {
          try {
            viewer360.setYaw(t.yaw !== undefined ? t.yaw : 0);
            viewer360.setPitch(t.pitch !== undefined ? t.pitch : 0);
            if (t.zoom) {
              var hfov = t.zoom <= 150 ? 110 : t.zoom <= 240 ? 90 : 65;
              viewer360.setHfov(hfov);
            }
          } catch(e){}
        }
        idx++;
      }
      proseguiTappa();
      timerTourPersonalizzato = setInterval(proseguiTappa, 6500);
    }
  }

  // Detector automatico della lingua del browser dell'utente (Francia, UK/USA, Germania, Spagna, Italia)
  function rilevaLinguaBrowser() {
    const lang = (navigator.language || navigator.userLanguage || 'it').toLowerCase();
    if (lang.indexOf('fr') !== -1) return 'fr-FR';
    if (lang.indexOf('en') !== -1) return 'en-US';
    if (lang.indexOf('de') !== -1) return 'de-DE';
    if (lang.indexOf('es') !== -1) return 'es-ES';
    return 'it-IT';
  }

  // Detector automatico della lingua del testo digitato in Chat
  function rilevaLinguaTesto(testo) {
    if (!testo) return 'it-IT';
    const lower = testo.toLowerCase();
    if (lower.match(/\b(kitchen|living|room|price|cost|how much|hello|hi|welcome|garden|bedroom|house|home|buy|rent|show|location|city)\b/)) return 'en-US';
    if (lower.match(/\b(cuisine|salon|prix|combien|bonjour|salut|maison|jardin|chambre|ville|location|acheter|montrer)\b/)) return 'fr-FR';
    if (lower.match(/\b(küche|preis|hallo|haus|wohnung|zimmer|stadt|kaufen|mieten|zeigen)\b/)) return 'de-DE';
    if (lower.match(/\b(cocina|precio|hola|casa|salon|cuanto|habitacion|ciudad|comprar|mostrar)\b/)) return 'es-ES';
    return 'it-IT';
  }

  // ────────────────────────────────────────────────────────────────
  function resetTimerInattivita() {
    if (isSpeaking) return; // Non avviare se ancora in parlato
    if (timerInattivita) clearTimeout(timerInattivita);
    timerInattivita = setTimeout(eseguiProssimoBloccoParlato, PAUSA_INATTIVITA_MS);

  // ────────────────────────────────────────────────────────────────
  //  Seleziona e lancia il prossimo "blocco" in alternanza ciclica
  //  Ordine: duo-sheet → storyteller → duo-hard → interruzione → ...
  // ────────────────────────────────────────────────────────────────
  function eseguiProssimoBloccoParlato() {
    if (isSpeaking) return;
    if (!isLiveAutoRunning) return;

    // Carica lo sheet se non ancora fatto
    if (!sheetCaricato) { caricaDialoghiDalloSheet(); return; }

    modalitaCorrente = (modalitaCorrente + 1) % 4;

    if (modalitaCorrente === 0) {
      // ── Modalità 0: Storyteller_Citta (dallo sheet) oppure monologo hardcoded ──
      if (sheetMonologhiCitta.length > 0) {
        var testo = sheetMonologhiCitta[indiceMonologo % sheetMonologhiCitta.length];
        indiceMonologo++;
        eseguiMonologoConCommento(testo);
      } else {
        var testoHard = MONOLOGHI_INFLUENCER[indiceMonologo % MONOLOGHI_INFLUENCER.length];
        indiceMonologo++;
        eseguiMonologoConCommento(testoHard);
      }
    } else if (modalitaCorrente === 1) {
      // ── Modalità 1: Dialogo Duo (usa prima lo sheet, poi hardcoded) ──
      eseguiDialogoDuo();
    } else if (modalitaCorrente === 2) {
      // ── Modalità 2: Monologo hardcoded con interruzione di DarIO ──
      var testoH2 = MONOLOGHI_INFLUENCER[indiceMonologo % MONOLOGHI_INFLUENCER.length];
      indiceMonologo++;
      eseguiMonologoConCommento(testoH2);
    } else {
      // ── Modalità 3: Battuta breve di DarIO (break umoristico) ──
      eseguiBattutaDario();
    }
  }

  function eseguiMonologoConCommento(testo) {
    if (!testo) { resetTimerInattivita(); return; }
    isSpeaking = true;
    addChatMessage(testo, 'daria');
    leggiConVoceConCallback(testo, 'it-IT', 'femmina', function() {
      // Pausa naturale DOPO DarIA, poi DarIO commenta
      setTimeout(function() {
        var commento = BATTUTE_INTERRUZIONE_DARIO[indiceInterruzioneDario % BATTUTE_INTERRUZIONE_DARIO.length];
        indiceInterruzioneDario++;
        addChatMessage(commento, 'dario');
        leggiConVoceConCallback(commento, 'it-IT', 'maschio', function() {
          isSpeaking = false;
          resetTimerInattivita();
        });
      }, PAUSA_TRA_BATTUTE_MS);
    });
  }

  // ────────────────────────────────────────────────────────────────
  //  Dialogo Duo — scorre battute in sequenza con callback
  // ────────────────────────────────────────────────────────────────
  function eseguiDialogoDuo() {
    var pool = DIALOGHI_DUO_DARIA_DARIO;
    if (!pool || pool.length === 0) { resetTimerInattivita(); return; }

    var battute = pool[indiceDuo % pool.length];
    indiceDuo++;
    if (!battute || battute.length === 0) { resetTimerInattivita(); return; }

    isSpeaking = true;
    var step = 0;

    function parlaStep() {
      if (step >= battute.length) {
        isSpeaking = false;
        resetTimerInattivita();
        return;
      }
      var b = battute[step];
      var voce = (b.speaker === 'dario') ? 'maschio' : 'femmina';
      addChatMessage(b.text, b.speaker || 'daria');
      leggiConVoceConCallback(b.text, 'it-IT', voce, function() {
        step++;
        // Pausa naturale tra battute: simula il ritmo di una conversazione reale
        setTimeout(parlaStep, PAUSA_TRA_BATTUTE_MS);
      });
    }
    parlaStep();
  }

  }

  let intervalSfumaturaVolume = null;

  function sfumaVolumeMusica(targetVol, durataMs) {
    const audioEl = document.getElementById('bg-music');
    if (!audioEl) return;
    if (intervalSfumaturaVolume) clearInterval(intervalSfumaturaVolume);

    const volumeIniziale = audioEl.volume;
    const passi = 12;
    const intervalloPasso = durataMs / passi;
    const variazionePasso = (targetVol - volumeIniziale) / passi;
    let passoCorrente = 0;

    intervalSfumaturaVolume = setInterval(function() {
      passoCorrente++;
      let nuovoVol = volumeIniziale + (variazionePasso * passoCorrente);
      if (nuovoVol < 0) nuovoVol = 0;
      if (nuovoVol > 1) nuovoVol = 1;
      audioEl.volume = nuovoVol;

      if (passoCorrente >= passi) {
        clearInterval(intervalSfumaturaVolume);
        audioEl.volume = targetVol;
      }
    }, intervalloPasso);
  }

  }

  function leggiConVoceConCallback(testo, lingua, genere, callback) {
    if (!lingua || lingua === 'it-IT' || lingua === 'it') {
      if (window.linguaAttivaDiretta && !window.linguaAttivaDiretta.toLowerCase().startsWith('it')) {

      return;
    }

    // 🛡️ DE-DUPLICAZIONE & FLUIDITÀ VOCALE UMANA: rimuove ripetizioni robotiche ravvicinate
    testo = testo.replace(/(?:—\s*(?:Antonio|Immobiliare)\s*Giancani[\s.,!?-]*){2,}/gi, '— Immobiliare Giancani.');
    testo = testo.replace(/Immobiliare Giancani\s+Immobiliare Giancani/gi, 'Immobiliare Giancani');
    testo = testo.replace(/Immobiliare Giancani\s+Immobiliare Giancani/gi, 'Immobiliare Giancani');
    if (genere === 'Coppia') {
      var frasi = testo.match(/[^.!?]+[.!?]+/g) || [testo];
      var validFrasi = [];
      for (var i = 0; i < frasi.length; i++) {
        if (frasi[i].trim().length > 2) validFrasi.push(frasi[i].trim());
      }
      if (validFrasi.length === 0) {
        if (typeof callback === 'function') callback();
        return;
      }
      var turnoDario = false;
      for (var j = 0; j < validFrasi.length; j++) {
        var cb = (j === validFrasi.length - 1) ? callback : null;
        codaVocale.push({ testo: validFrasi[j], lingua: lingua, genere: turnoDario ? 'DarIO' : 'DarIA', callback: cb });
        turnoDario = !turnoDario;
      }
    } else {
      codaVocale.push({ testo: testo, lingua: lingua, genere: genere, callback: callback });
    }
    _processaCodaVocale();

  // 🎙️ TRASFORMATORE TESTO VOCALE PERFETTO: Pulisce link tecnici e converte URL in frasi memorabili
  function formattaTestoPerLetturaVocale(testoRaw) {
    if (!testoRaw) return "";
    var t = String(testoRaw);

    // 1. Rimuovi tag HTML ed emoji
    t = t.replace(/<[^>]*>?/gm, ' ')
         .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}]/gu, '');

    // 2. Trasforma i link del sito in linguaggio naturale memorabile per il pubblico
    // Es. https://www.immobiliaregiancani.it/... -> "ci trovate su immobiliaregiancani.it"
    t = t.replace(/https?:\/\/(www\.)?immobiliaregiancani\.it[^\s\),;"']*/gi, 'ci trovate su immobiliaregiancani.it');
    t = t.replace(/www\.immobiliaregiancani\.it/gi, 'immobiliaregiancani.it');

    // 3. Trasforma link social
    t = t.replace(/https?:\/\/(www\.)?facebook\.com[^\s\),;"']*/gi, 'sulla nostra pagina Facebook');
    t = t.replace(/https?:\/\/(www\.)?instagram\.com[^\s\),;"']*/gi, 'sul nostro profilo Instagram');
    t = t.replace(/https?:\/\/(www\.)?youtube\.com[^\s\),;"']*/gi, 'sul nostro canale YouTube');
    t = t.replace(/https?:\/\/(www\.)?tiktok\.com[^\s\),;"']*/gi, 'sul nostro profilo TikTok');
    t = t.replace(/https?:\/\/(www\.)?wa\.me[^\s\),;"']*/gi, 'su WhatsApp al 320 166 71 56');

    // 4. Qualsiasi altro link tecnico o URL grezzo (evita "acca titi pi esse due punti barra barra")
    t = t.replace(/https?:\/\/[^\s\),;"']+/gi, 'sul nostro sito web');
    t = t.replace(/www\.[a-z0-9\-_]+\.[a-z]{2,6}[^\s\),;"']*/gi, 'sul nostro sito');

    // 5. Espansione abbreviazioni immobiliari per una pronuncia fluida
    t = t.replace(/\b(\d+)\s*(mq|m²|mq\.)\b/gi, '$1 metri quadri');
    t = t.replace(/\b(mq|m²|mq\.)\b/gi, 'metri quadri');
    t = t.replace(/\bn[°\.]\s*(\d+)/gi, 'numero $1');
    t = t.replace(/\b(tel|cel|cell)\.?\s*[:\-]?\s*/gi, 'telefono ');
    t = t.replace(/\b€\s*([\d\.\,]+)/gi, '$1 euro');
    t = t.replace(/([\d\.\,]+)\s*€/gi, '$1 euro');
    t = t.replace(/\b(rif|rif\.)\s*([a-z0-9\-]+)/gi, 'riferimento $2');
    t = t.replace(/\b(p\.t\.|piano t)\b/gi, 'piano terra');
    t = t.replace(/\b1°\b/g, 'primo').replace(/\b2°\b/g, 'secondo').replace(/\b3°\b/g, 'terzo').replace(/\b4°\b/g, 'quarto').replace(/\b5°\b/g, 'quinto');

    // 6. Pulisci caratteri speciali fastidiosi per il TTS
    t = t.replace(/[_#\\/|@{}\<\>\[\]~^`+*=]/g, ' ');
    t = t.replace(/\s+/g, ' ').trim();

    // 7. Normalizzazione branding: mai far sembrare Giancani il cognome dei conduttori o ospiti
    t = t.replace(/\b(Daria|DarIA)\s+Giancani\b/gi, "DarIA per l'agenzia Immobiliare Giancani");
    t = t.replace(/\b(Dario|DarIO)\s+Giancani\b/gi, "DarIO per l'agenzia Immobiliare Giancani");
    t = t.replace(/\b(Diego|Fabiola|Walter|Ugo|Leo|Isabella|Elsa|Cosimo)\s+Giancani\b/gi, "$1 dell'agenzia Immobiliare Giancani");
    t = t.replace(/\bcon\s+Immobiliare\s+Giancani\b/gi, "con l'agenzia Immobiliare Giancani");
    t = t.replace(/\bda\s+Immobiliare\s+Giancani\b/gi, "dall'agenzia Immobiliare Giancani");
    t = t.replace(/\bper\s+Immobiliare\s+Giancani\b/gi, "per l'agenzia Immobiliare Giancani");
    t = t.replace(/\bdi\s+Immobiliare\s+Giancani\b/gi, "dell'agenzia Immobiliare Giancani");

    var occ = (t.match(/Immobiliare Giancani/gi) || []).length;
    var regexEnd = /\s*[—–-]\s*Immobiliare\s*Giancani[.!]?\s*$/i;
    if (regexEnd.test(t)) {
      if (occ > 1) {
        t = t.replace(regexEnd, '.');
      } else {
        var form = [
          ", in esclusiva con l'agenzia Immobiliare Giancani.",
          ", curata dall'agenzia Immobiliare Giancani.",
          ", proposta esclusiva dell'agenzia Immobiliare Giancani.",
          ", con la professionalità dell'agenzia Immobiliare Giancani.",
          ", qui all'agenzia Immobiliare Giancani."
        ];
        t = t.replace(regexEnd, form[Math.abs(t.length) % form.length]);
      }
    }

    return t;
  }

  function _leggiConEdgeTTSWebSocket(testo, voiceName, task, onCompletato) {
    console.log('[DARIA-DIAG] 🌐 EDGE_TTS — Avvio WebSocket | Voce: ' + voiceName + ' | Chars: ' + testo.length);
    try {
      var ws = new WebSocket("wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4");
      ws.binaryType = "arraybuffer"; // 👈 Ricezione sincrona binaria: zero pezzi persi, nessuna frase mozzata
      
      var reqId = 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
      
      var audioChunks = [];
      var isDone = false;
      
      var timeout = setTimeout(function() {
        if(!isDone) {
          isDone = true;
          try { ws.close(); } catch(e){}
          console.warn("[DARIA-DIAG] ⚠️ Edge TTS timeout, fallback locale SpeechSynthesis");
          _leggiConSpeechSynthesis(testo, task.lingua, task.genere, onCompletato);
        }
      }, 20000);

      ws.onopen = function() {
        var dateStr = new Date().toISOString();
        var configMsg = "X-Timestamp: " + dateStr + "\r\n" +
                        "Content-Type: application/json; charset=utf-8\r\n" +
                        "Path: speech.config\r\n\r\n" +
                        '{"context":{"synthesis":{"audio":{"metadataOptions":{"sentenceBoundaryEnabled":false,"wordBoundaryEnabled":true},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}';
        ws.send(configMsg);
        
        var xmlLang = (task && task.xmlLang) ? task.xmlLang : 'it-IT';
        var cleanSsmlText = testo.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var ssml = "<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='" + xmlLang + "'><voice name='" + voiceName + "'>" + cleanSsmlText + "</voice></speak>";
        var ssmlMsg = "X-RequestId: " + reqId + "\r\n" +
                      "Content-Type: application/ssml+xml\r\n" +
                      "X-Timestamp: " + dateStr + "\r\n" +
                      "Path: ssml\r\n\r\n" + ssml;
        ws.send(ssmlMsg);
      };

      ws.onmessage = function(e) {
        if (typeof e.data === "string") {
          if (e.data.indexOf("Path: turn.end") !== -1) {
            isDone = true;
            clearTimeout(timeout);
            try { ws.close(); } catch(e){}
            
            if (audioChunks.length > 0) {
              abbassaMusicaDucking();
              var blob = new Blob(audioChunks, { type: 'audio/mp3' });
              var audioUrl = URL.createObjectURL(blob);
              var audio = new Audio(audioUrl);
              audio.onended = function() {
                ripristinaMusicaDucking();
                onCompletato();
              };
              audio.onerror = function(errA) {
                console.warn("Errore playback audio Edge TTS:", errA);
                ripristinaMusicaDucking();
                _leggiConSpeechSynthesis(testo, task.lingua, task.genere, onCompletato);
              };
              audio.play().catch(function(err) {
                console.warn("Play Edge TTS fallito (blocco autoplay?):", err);
                ripristinaMusicaDucking();
                _leggiConSpeechSynthesis(testo, task.lingua, task.genere, onCompletato);
              });
            } else {
              _leggiConSpeechSynthesis(testo, task.lingua, task.genere, onCompletato);
            }
          }
        } else if (e.data instanceof ArrayBuffer) {
          try {
            var view = new DataView(e.data);
            var headerLength = view.getUint16(0, false);
            var audioData = e.data.slice(2 + headerLength);
            audioChunks.push(audioData);
          } catch(eBuf) {
            console.error("Errore decodifica chunk audio:", eBuf);
          }
        } else if (e.data instanceof Blob) {
          var reader = new FileReader();
          reader.onload = function() {
            var buffer = reader.result;
            var view = new DataView(buffer);
            var headerLength = view.getUint16(0, false);
            var audioData = buffer.slice(2 + headerLength);
            audioChunks.push(audioData);
          };
          reader.readAsArrayBuffer(e.data);
        }
      };
      
      ws.onerror = function(e) {
        if(!isDone) {
          isDone = true;
          clearTimeout(timeout);
          try { ws.close(); } catch(e2){}
          console.warn("Edge TTS WebSocket fallito, fallback SpeechSynthesis:", e);
          _leggiConSpeechSynthesis(testo, task.lingua, task.genere, onCompletato);
        }
      };
    } catch(err) {
      console.warn("Eccezione Edge TTS WebSocket, fallback SpeechSynthesis:", err);
      _leggiConSpeechSynthesis(testo, task.lingua, task.genere, onCompletato);
    }
  }

  let timerWatchdogVocale = null;

  function _leggiConSpeechSynthesis(testoPulito, lingua, genere, callback) {
    console.log('[DARIA-DIAG] 🔊 SPEECH_SYNTH — Fallback SpeechSynthesis | Lingua: ' + lingua + ' | Genere: ' + genere);
    if (!('speechSynthesis' in window)) {
      console.error('[DARIA-DIAG] ❌ SPEECH_SYNTH — Il browser NON supporta SpeechSynthesis! Audio impossibile. Usare Chrome/Edge.');
    }
    if (timerWatchdogVocale) { clearTimeout(timerWatchdogVocale); timerWatchdogVocale = null; }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(testoPulito);
      window.currentUtterance = msg; // v115 — Mantiene riferimento globale per evitare Garbage Collection su Chrome/Mobile

      const targetLang = lingua || 'it-IT';
      msg.lang = targetLang; 
      msg.rate = 1.0; 
      msg.pitch = (genere === 'maschio') ? 0.85 : 1.15;
      
      const voices = window.speechSynthesis.getVoices();
      const langPrefix = targetLang.substring(0, 2).toLowerCase();

      let targetVoice = null;
      if (genere === 'maschio' || genere === 'DarIO' || genere === 'Diego' || genere === 'Gianni') {
        targetVoice = voices.find(function(v) {
          return v.lang.toLowerCase().indexOf(langPrefix) !== -1 && (v.name.toLowerCase().includes('giuseppe') || v.name.toLowerCase().includes('diego') || v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('cosimo'));
        });
      } else {
        targetVoice = voices.find(function(v) {
          return v.lang.toLowerCase().indexOf(langPrefix) !== -1 && (v.name.toLowerCase().includes('isabella') || v.name.toLowerCase().includes('elsa') || v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('alice'));
        });
      }
      if (!targetVoice) {
        targetVoice = voices.find(function(v) { return v.lang.toLowerCase().indexOf(langPrefix) !== -1; });
      }
      if (targetVoice) msg.voice = targetVoice;

      let completatoOgg = false;
      const fineVoce = function() {
        if (completatoOgg) return;
        completatoOgg = true;
        if (timerWatchdogVocale) { clearTimeout(timerWatchdogVocale); timerWatchdogVocale = null; }
        ripristinaMusicaDucking();
        if (typeof callback === 'function') callback();
      };

      msg.onstart = function() { abbassaMusicaDucking(); };
      msg.onend = fineVoce;
      msg.onerror = fineVoce;

      // WATCHDOG GENEROSO — Non tagliare mai frasi lunghe prematurely
      var stimaDurataMs = Math.max(testoPulito.length * 150, 20000);
      timerWatchdogVocale = setTimeout(fineVoce, stimaDurataMs);

      window.speechSynthesis.speak(msg);
    } else {
      if (typeof callback === 'function') callback();
    }
  }

  // 🕒 FUNZIONE HELPER: ORARIO ESATTO ITALIANO (Europe/Rome)
  function getOraItalianaEsatta() {
    try {
      var now = new Date();
      var parts = new Intl.DateTimeFormat('it-IT', {
        timeZone: 'Europe/Rome',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(now);

      var ore = '00';
      var min = '00';
      parts.forEach(function(p) {
        if (p.type === 'hour') ore = p.value;
        if (p.type === 'minute') min = p.value;
      });
      var oInt = parseInt(ore, 10);
      var mInt = parseInt(min, 10);
      var minPad = mInt < 10 ? '0' + mInt : '' + mInt;
      var orePad = oInt < 10 ? '0' + oInt : '' + oInt;

      var testoParlato = "";
      if (mInt === 0) {
        testoParlato = "le " + oInt + " in punto";
      } else {
        testoParlato = "le " + oInt + " e " + minPad;
      }

      return {
        ore: oInt,
        min: mInt,
        oreStr: orePad,
        minStr: minPad,
        orarioDisplay: orePad + ":" + minPad,
        testoParlato: testoParlato
      };
    } catch(e) {
      var now = new Date();
      var ore = now.getHours();
      var min = now.getMinutes();
      var minPad = min < 10 ? '0' + min : '' + min;
      var orePad = ore < 10 ? '0' + ore : '' + ore;
      return {
        ore: ore,
        min: min,
        oreStr: orePad,
        minStr: minPad,
        orarioDisplay: orePad + ":" + minPad,
        testoParlato: "le " + ore + " e " + minPad
      };
    }
  }

    if (index >= spotPubblicitaArray.length) index = 0;
    
    var spot = spotPubblicitaArray[index];
    var tempoAttesaMs = (spot.frequenzaMinuti || 5) * 60000;
    
    timeoutPubblicitaSpot = setTimeout(function() {
      mostraSpotPubblicitario(spot);
      pianificaProssimoSpot(index + 1);
    }, tempoAttesaMs);
  }

  function mostraSpotPubblicitario(spot) {
    var bannerContainer = document.getElementById('hero-banner-media');
    var bannerImg = document.getElementById('hero-banner-img');
    var bannerVideo = document.getElementById('hero-banner-video');
    var bannerBadge = document.getElementById('hero-banner-badge');
    
    if(!bannerContainer) return;

    bannerContainer.style.display = 'block';
    bannerBadge.style.display = 'block';
    
    if (spot.tipoMedia === 'video' || spot.mediaUrl.indexOf('.mp4') !== -1) {
      bannerImg.style.display = 'none';
      bannerVideo.style.display = 'block';
      bannerVideo.src = spot.mediaUrl;
    } else {
      bannerVideo.style.display = 'none';
      bannerImg.style.display = 'block';
      bannerImg.style.backgroundImage = "url('" + spot.mediaUrl + "')";
    }
    
    // Leggi il testo (TTS)
    if (spot.testoParlato) {
      leggiConVoceConCallback(spot.testoParlato, 'it-IT', 'femmina', function() {
         // Dopo aver letto il testo, nascondi il banner pubblicitario per riprendere il ciclo normale dell'immobile
         setTimeout(function(){
            bannerBadge.style.display = 'none';
            // Il banner ritorna al ciclo normale 5 sec
         }, 2000);
      });
    }
  }

  // =======================================================
  // 🎥 GESTORE VIDEO SPOT RANDOM OGNI 5 MINUTI (Post_YouTube - 60 SECONDI)
  // Con Sfumatura Audio in Entrata, Uscita e Ducking Dinamico DarIA/DarIO
  // =======================================================
  var spotYouTubeArray = [];
  var timerSpotYouTube5Min = null;
  var isSpotYouTubeInOnda = false;
  var timerFadeOutSpot = null;

  function estraiYouTubeId(url) {
    if (!url) return '';
    var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|.*[?&]v=)|(?:\/|^))([a-zA-Z0-9_-]{11})/i);
    return (m && m[1]) ? m[1] : '';
  }

  function sfumaVolumeYouTubeVideo(iframeEl, startVol, targetVol, durataMs) {
    if (!iframeEl || !iframeEl.contentWindow) return;
    var passi = 10;
    var stepMs = durataMs / passi;
    var diff = (targetVol - startVol) / passi;
    var current = startVol;
    var stepCount = 0;
    var timerFade = setInterval(function() {
      stepCount++;
      current += diff;
      if (current < 0) current = 0;
      if (current > 100) current = 100;
      try {
        iframeEl.contentWindow.postMessage(JSON.stringify({
          event: 'command',
          func: 'setVolume',
          args: [Math.round(current)]
        }), '*');
      } catch(e) {}
      if (stepCount >= passi) {
        clearInterval(timerFade);
      }
    }, stepMs);
  }

  window.avviaCicloYouTube = function() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(res) {
        if (res && res.length > 0) {
          spotYouTubeArray = res;
          console.log('[DARIA-LIVE] 🎥 Caricati ' + res.length + ' video dal foglio Post_YouTube per gli spot ogni 5 min.');
          pianificaProssimoSpotYouTube5Min();
        }
      }).getPostYouTubeAttivi();
    }
  };

  function pianificaProssimoSpotYouTube5Min() {
    if (timerSpotYouTube5Min) clearTimeout(timerSpotYouTube5Min);
    // Timer fisso a 5 minuti precisi (300.000 ms)
    var intervallo5MinMs = 5 * 60 * 1000;
    timerSpotYouTube5Min = setTimeout(function() {
      mandaInOndaSingoloVideoRandomYouTube();
    }, intervallo5MinMs);
  }

  function mandaInOndaSingoloVideoRandomYouTube() {
    if (!spotYouTubeArray || spotYouTubeArray.length === 0) {
      pianificaProssimoSpotYouTube5Min();
      return;
    }

    // 1. Sceglie UNO SOLO dei video presenti nel foglio Post_YouTube A RANDOM
    var randomIdx = Math.floor(Math.random() * spotYouTubeArray.length);
    var video = spotYouTubeArray[randomIdx];
    var vidId = estraiYouTubeId(video.videoUrl || video.linkYt || video.idVideo);
    if (!vidId) vidId = 'sB1z2vrxz_Q';

    console.log('[DARIA-LIVE] 🎬 SPOT 5 MIN: Mando in onda video random (60s) "' + video.titolo + '" (ID: ' + vidId + ')');
    isSpotYouTubeInOnda = true;

    // 2. Sfumatura in uscita della musica di sottofondo (Fade Out musica live)
    sfumaVolumeMusica(0.01, 1000);

    // 3. Attiva il player video principale su YouTube Container con audio attivo
    var ytContainer = document.getElementById('youtube-container');
    var photoContainer = document.getElementById('photo-container');
    var videoBg = document.getElementById('video-container');
    var titoloStanzaEl = document.getElementById('current-room-title') || document.getElementById('stanza-titolo');
    var tickerInner = document.getElementById('live-ticker-inner');

    var embedUrl = "https://www.youtube.com/embed/" + vidId + "?autoplay=1&mute=0&controls=0&rel=0&playsinline=1&enablejsapi=1";

    if (photoContainer) photoContainer.style.opacity = '0';
    if (videoBg) videoBg.style.opacity = '0';
    if (ytContainer) {
      ytContainer.src = embedUrl;
      ytContainer.style.opacity = '1';
      ytContainer.style.pointerEvents = 'auto';
    }

    // Aggiorna grafica a schermo per lo spot
    if (titoloStanzaEl) titoloStanzaEl.innerText = "🎬 ANTEPRIMA VIDEO: " + (video.titolo || "Immobile Esclusivo");
    if (tickerInner) tickerInner.innerText = "🎬 ANTEPRIMA VIDEO: " + (video.titolo || "") + " — Immobiliare Giancani";

    // Imposta volume iniziale video al 18% (ducking) mentre DarIA/DarIO dicono la brevissima frase
    setTimeout(function() {
      try {
        if (ytContainer && ytContainer.contentWindow) {
          ytContainer.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
          ytContainer.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[18]}', '*');
        }
      } catch(e) {}
    }, 1200);

    // 4. Frase BREVISSIMA di DarIA (1 sola frase concisa per lasciare spazio all'audio del video)
    var testoPuro = (video.testoParlato || '').trim();
    var primaFrase = testoPuro.split('.')[0] || '';
    if (primaFrase.length > 120) primaFrase = primaFrase.substring(0, 115) + '...';
    
    var testoIntroBreve = (primaFrase && primaFrase.length > 10) 
      ? (primaFrase + ". Buona visione da Immobiliare Giancani.")
      : ("Ed ora vi mostriamo questa speciale anteprima video. Buona visione da Immobiliare Giancani.");

    if (typeof leggiConVoceConCallback === 'function') {
      leggiConVoceConCallback(testoIntroBreve, 'it-IT', 'femmina', function() {
        console.log('[DARIA-LIVE] 🗣️ Intro breve DarIA completata. Sfumatura audio video al 100% per godersi il filmato in silenzio.');
        // Appena DarIA finisce, l'audio del video sale dolcemente al 100% in 1.5 secondi
        if (ytContainer) {
          sfumaVolumeYouTubeVideo(ytContainer, 18, 100, 1500);
        }
      });
    } else {
      setTimeout(function() {
        if (ytContainer) sfumaVolumeYouTubeVideo(ytContainer, 18, 100, 1500);
      }, 5000);
    }

    // 5. Sfumatura in uscita (Fade Out) dell'audio video a 56 secondi (4s prima della chiusura)
    if (timerFadeOutSpot) clearTimeout(timerFadeOutSpot);
    timerFadeOutSpot = setTimeout(function() {
      console.log('[DARIA-LIVE] 🔉 Sfumatura audio video in uscita prima del ripristino tour.');
      if (ytContainer) {
        sfumaVolumeYouTubeVideo(ytContainer, 100, 0, 3500);
      }
    }, 56000);

    // 6. Durata esatta dello spot video a schermo: esattamente 60 secondi
    setTimeout(ripristinaTourNormaleDaSpotYouTube, 60000);
  }

  function ripristinaTourNormaleDaSpotYouTube() {
    console.log('[DARIA-LIVE] 🔄 Spot video 60s terminato. Ripristino musica e tour 360 regolare.');
    var ytContainer = document.getElementById('youtube-container');
    var photoContainer = document.getElementById('photo-container');
    
    if (ytContainer) {
      ytContainer.style.opacity = '0';
      ytContainer.style.pointerEvents = 'none';
      ytContainer.src = '';
    }
    if (photoContainer) {
      photoContainer.style.opacity = '1';
    }

    isSpotYouTubeInOnda = false;

    // Ripristina musica di sottofondo con sfumatura morbida in salita (Fade In)
    sfumaVolumeMusica(0.30, 1500);

    // Riprogramma il prossimo spot singolo random tra 5 minuti
    pianificaProssimoSpotYouTube5Min();
  }

  // Avvio caricamento lista video da Post_YouTube all'avvio
  setTimeout(avviaCicloYouTube, 3000);

function togglePubblicitaAttiva(idx) {
  let pub = pubblicitaLista.find(p => p.idx === idx);
  if (!pub) return;
  pub.isAttivo = !pub.isAttivo; // inverti
  aggiornaPubblicita(idx);
}

function aggiornaPubblicita(idx) {
  let pub = pubblicitaLista.find(p => p.idx === idx);
  if (!pub) return;
  
  let freqInput = document.getElementById('pub-freq-'+idx);
  let btn = document.getElementById('pub-btn-'+idx);
  if (!freqInput || !btn) return;
  
  let newFreq = parseInt(freqInput.value);
  if (isNaN(newFreq) || newFreq <= 0) newFreq = 5;
  
  // Update UI speculativamente
  if (pub.isAttivo) {
    btn.innerHTML = '✅ ON';
    btn.style.background = '#2ecc71';
  } else {
    btn.innerHTML = '❌ OFF';
    btn.style.background = '#aaa';
  }
  btn.style.opacity = '0.5';
  freqInput.style.opacity = '0.5';
  
  google.script.run
    .withSuccessHandler(function(res) {
      btn.style.opacity = '1';
      freqInput.style.opacity = '1';
      if (!res || !res.success) {
        alert("Errore salvataggio pubblicità: " + (res?res.error:''));
      }
    })
    .salvaModificaPubblicita(pub.rowIndex, newFreq, pub.isAttivo);
}

var postFBArray = [];

var timerPostFB = null;
var isPostFBGlobaleAttivo = true;
var intervalloMinutiFB = 15;

window.avviaCicloPostFacebook = function() {
  if (!isLiveAutoRunning) return;
  console.log("[DARIA-DIAG] 📘 POST_FB — Avvio ciclo palinsesto Post Facebook...");
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        postFBArray = res.posts || [];
        isPostFBGlobaleAttivo = res.isAttivo !== false;
        intervalloMinutiFB = res.frequenzaMinuti || 15;
        console.log("[DARIA-DIAG] 📘 POST_FB — Caricati " + postFBArray.length + " post active | Intervallo: " + intervalloMinutiFB + " min | Attivo: " + isPostFBGlobaleAttivo);
        pianificaProssimoPostFB();
      }
    })
    .withFailureHandler(function(err) {
      console.error("[DARIA-DIAG] ❌ POST_FB — Errore caricamento post Facebook:", err);
    })
    .getAllPostFacebook();
};

function pianificaProssimoPostFB() {
  if (timerPostFB) clearTimeout(timerPostFB);
  if (!isPostFBGlobaleAttivo || postFBArray.length === 0) return;
  
  var msIntervallo = Math.max(intervalloMinutiFB, 2) * 60 * 1000;
  timerPostFB = setTimeout(function() {
    if (!isLiveAutoRunning || !isPostFBGlobaleAttivo) return;
    
    var activePosts = postFBArray.filter(function(p) { return p.isAttivo; });
    if (activePosts.length === 0) return;
    
    if (indexPostFB >= activePosts.length) indexPostFB = 0;
    var post = activePosts[indexPostFB];
    indexPostFB++;
    
    eseguiSegmentoPostFacebook(post);
    pianificaProssimoPostFB();
  }, msIntervallo);
}

function eseguiSegmentoPostFacebook(post) {
  if (!post) return;
  console.log("[DARIA-DIAG] 📘 POST_FB — Esecuzione segmento post Facebook: " + post.idPost);
  
  var urlMedia = post.mediaUrl || post.thumbUrl || "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1920&auto=format&fit=crop";
  var tipo = post.tipoMedia || 'video';
  
  var dataUI = {
    urlMedia: urlMedia,
    tipoMedia: tipo,
    stanza: "Video Post Facebook",
    linkAnnuncio: post.linkFb || "https://www.facebook.com"
  };
  ultimoMediaUrl = "";
  updateUI(dataUI);
  
  // REGOLA GLOBALE: Il testo viene da Colonna F (post.testoParlato)
  var testoColF = post.testoParlato || "Ecco un nuovo video speciale dalla nostra pagina Facebook!";
  if (testoColF.indexOf('Immobiliare Giancani') === -1) {
    testoColF = testoColF.trim() + " — Presentato da Immobiliare Giancani";
  }
  
  var annuncioDaria = "📺 Dalla nostra pagina Facebook ufficiale! Ecco un contenuto video in evidenza: " + testoColF;
  addChatMessage("📘 [POST FACEBOOK] " + annuncioDaria, 'daria');
  
  isSpeaking = true;
  leggiConVoceConCallback(annuncioDaria, post.lingua || 'it-IT', 'femmina', function() {
    var commentoDario = "Video spettacolare DarIA! Ricordo a tutti di seguire la pagina Facebook di Immobiliare Giancani per non perdere le novità!";
    addChatMessage("👨‍💼 DarIO: " + commentoDario, 'dario');
    leggiConVoceConCallback(commentoDario, 'it-IT', 'maschio', function() {

      resetTimerInattivita();
    });
  });
}

function eseguiComandoStanzaDaRemoto(reqObj) {
  if (!reqObj) return;
  var nomeStanza = (typeof reqObj === 'object' && reqObj.stanza) ? reqObj.stanza : String(reqObj || '');
  var nomePersona = (typeof reqObj === 'object' && reqObj.autore) ? reqObj.autore : 'uno spettatore in diretta';
  var isSuperiore10s = (typeof reqObj === 'object' && (reqObj.superiore10s === true || reqObj.deltaSec >= 10));

  console.log("🎯 [DIRETTA] Esecuzione richiesta stanza:", nomeStanza, "| Persona:", nomePersona, "| >10s:", isSuperiore10s);

  window.isInterazioneCommentoInCorso = true;
  lastRealUserMessageTime = Date.now();
  if (timerRitornoBase) { clearTimeout(timerRitornoBase); timerRitornoBase = null; }
  interrompiAudioEPuliziaCoda();

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data) { window.isInterazioneCommentoInCorso = false; return; }
      var stTitle = data.stanza || nomeStanza;
      var urlMedia = convertiUrlDriveDirect(data.mediaUrl);
      var testoDescrizioneColF = (data.testoDaLeggere || data.testo || '').replace(/—\s*Immobiliare Giancani/gi, '— Immobiliare Giancani');
      if (testoDescrizioneColF.indexOf('Immobiliare Giancani') === -1) testoDescrizioneColF += ' — Immobiliare Giancani';

      function mostraMediaStanzaASchermo() {
        updateUI(data, true);
        if (urlMedia && urlMedia.startsWith('http')) {
          var ic = document.getElementById('image-container');
          var p360 = document.getElementById('panorama-360-container');
          var vc = document.getElementById('video-container');
          var yt = document.getElementById('youtube-container');
          if (vc) nascondiMedia(vc);
          if (yt) nascondiMedia(yt);

          if (data.tipoMedia === '360') {
            if (p360) mostraMedia(p360);
            gestisciPannellum360(urlMedia);
          } else if (data.tipoMedia === 'video') {
            if (p360) nascondiMedia(p360);
            if (ic) nascondiMedia(ic);
            if (urlMedia.indexOf('youtube.com') !== -1 || urlMedia.indexOf('youtu.be') !== -1) {
              if (yt) {
                var vId = estraiIdVideoYouTube(urlMedia);
                yt.innerHTML = '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/' + vId + '?autoplay=1&controls=0&mute=0&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
                mostraMedia(yt);
              }
            } else if (vc) {
              vc.innerHTML = '<video src="' + urlMedia + '" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>';
              mostraMedia(vc);
            }
          } else {
            if (p360) nascondiMedia(p360);
            if (ic) {
              ic.style.backgroundImage = "url('" + urlMedia + "')";
              ic.style.backgroundSize = "cover";
              ic.style.backgroundPosition = "center";
              mostraMedia(ic);
            }
          }
          aggiornaGuardLayer(urlMedia);
        }
      }

      if (isSuperiore10s) {
        // ⏱️ CASO RITARDO > 10 SECONDI:
        // Prima di cambiare schermata e mettere il video/immagine, DarIA annuncia la richiesta
        var fraseRitardo = "Abbiamo avuto una richiesta online da parte di " + nomePersona + " per far vedere la stanza " + stTitle + "... Un attimo che la mettiamo online per voi!";
        addChatMessage("👩 DarIA: " + fraseRitardo + " — Immobiliare Giancani", 'daria');
        isSpeaking = true;

        leggiConVoceConCallback(fraseRitardo, "it-IT", "femmina", function() {
          // Successivamente cambia la schermata mandando online il media da Colonna A e leggendo Colonna F
          mostraMediaStanzaASchermo();
          addChatMessage("👩 DarIA: " + testoDescrizioneColF, 'daria');
          leggiConVoceConCallback(testoDescrizioneColF, data.lingua || "it-IT", "femmina", function() {
            var commentoDarIO = "Splendida richiesta " + nomePersona + "! Per qualsiasi informazione o per visitare " + stTitle + ", siamo a vostra completa disposizione — Immobiliare Giancani!";
            addChatMessage("👨‍💼 DarIO: " + commentoDarIO, 'dario');
            leggiConVoceConCallback(commentoDarIO, data.lingua || "it-IT", "maschio", function() {
              isSpeaking = false;
              setTimeout(function() {
                window.isInterazioneCommentoInCorso = false;
                resetTimerInattivita();
              }, 15000);
            });
          });
        });

      } else {
        // ⚡ CASO IMMEDIATO (<= 10 SECONDI):
        // Mostra subito il media a schermo
        mostraMediaStanzaASchermo();
        var fraseImmediata = "Grazie " + nomePersona + " per averci chiesto di vedere " + stTitle + "! Eccola subito qui in diretta per te da Immobiliare Giancani!";
        addChatMessage("👩 DarIA: " + fraseImmediata, 'daria');
        isSpeaking = true;

        leggiConVoceConCallback(fraseImmediata, "it-IT", "femmina", function() {
          addChatMessage("👩 DarIA: " + testoDescrizioneColF, 'daria');
          leggiConVoceConCallback(testoDescrizioneColF, data.lingua || "it-IT", "femmina", function() {
            var commentoDarIO = "Per qualsiasi informazione o visita privata su " + stTitle + ", scriveteci pure nei commenti o al 320 166 71 56 — Immobiliare Giancani!";
            addChatMessage("👨‍💼 DarIO: " + commentoDarIO, 'dario');
            leggiConVoceConCallback(commentoDarIO, data.lingua || "it-IT", "maschio", function() {
              isSpeaking = false;
              setTimeout(function() {
                window.isInterazioneCommentoInCorso = false;
                resetTimerInattivita();
              }, 15000);
            });
          });
        });
      }
    })
    .withFailureHandler(function(err) {
      window.isInterazioneCommentoInCorso = false;
      console.error("Errore getImmobileData per comando chat:", err);
    })

}

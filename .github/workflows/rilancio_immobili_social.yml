name: 🤖 Bot Rilancio Immobili Social (Archivio)

on:
  schedule:
    # Esecuzione quotidiana alle 13:00 italiane (12:00 UTC)
    - cron: '0 12 * * *'
    # Seconda verifica pomeridiana alle 17:30 italiane (16:30 UTC)
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza la proposta di rilancio anche se oggi è già stato pubblicato un post (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  rilancio_immobili:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurazione Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installazione Dipendenze
        run: |
          pip install --upgrade pip
          pip install requests urllib3

      - name: 🚀 Esecuzione Bot Rilancio Social
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_API_TOKEN: ${{ secrets.WP_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 scripts/bot_rilancio_immobili_social.py --force
          else
            python3 scripts/bot_rilancio_immobili_social.py
          fi

      - name: 💾 Commit & Push Aggiornamento Indice Rotazione
        run: |
          git config --global user.name "Giancani Social Bot"
          git config --global user.email "bot@immobiliaregiancani.it"
          git add -A scripts/data/last_reposted_index.json || true
          git commit -m "chore: aggiornato indice rotazione rilancio immobili [skip ci]" || echo "Nessuna modifica da salvare"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin main && break || sleep 2
          done

name: Serverless Multistream Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video o della Web App'
        required: true
      fb_key:
        description: 'Facebook RTMP URL completo'
        required: false
      yt_key:
        description: 'YouTube Stream Key o URL RTMP completo'
        required: false
      tk_key:
        description: 'TikTok RTMP URL completo'
        required: false
      ig_key:
        description: 'Instagram RTMP URL completo'
        required: false
      duration_hours:
        description: 'Durata massima della diretta in ore'
        required: false
        default: '6'
      stream_quality:
        description: 'Qualità stream (1080p_high, 1080p_std, 720p_hq, 720p_eco)'
        required: false
        default: '1080p_std'
      scale_factor:
        description: 'Scala Device Chrome (1.0 = Desktop 1:1, 1.25 = Zoom)'
        required: false
        default: '1.0'

jobs:
  multistream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Headless Environment and Audio Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb openbox pulseaudio pulseaudio-utils alsa-utils jq curl
          
          # Installa Google Chrome stabile
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          google-chrome --version
          ffmpeg -version | head -1

      - name: Setup Playwright and Headless Automation Engines
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps
          npx playwright chromium
          python3 -m pip install playwright requests

      - name: Launch Audio Engine, Browser and Start Multistream
        run: |
          # 1. Configura ALSA per PulseAudio
          mkdir -p ~/.config/pulse
          echo 'pcm.!default { type pulse }' > ~/.asoundrc
          echo 'ctl.!default { type pulse }' >> ~/.asoundrc

          # 2. Avvia PulseAudio
          pulseaudio -D --exit-idle-time=-1 --system=false || true
          sleep 2
          
          # 3. Sink Virtuale per Audio Browser
          pactl load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink || true
          pactl set-default-sink VirtualSink || true

          export DISPLAY=:99

          # 4. Server X virtuale 1920x1080
          Xvfb :99 -screen 0 1920x1080x24 &
          openbox &
          sleep 2

          mkdir -p /tmp/chrome_clean_profile
          touch "/tmp/chrome_clean_profile/First Run"

          SCALE_FACTOR="${{ github.event.inputs.scale_factor }}"
          if [ -z "$SCALE_FACTOR" ]; then SCALE_FACTOR="1.0"; fi

          echo "Avvio Chrome con Scala $SCALE_FACTOR sulla pagina: ${{ github.event.inputs.video_url }}"
          google-chrome \
            --kiosk \
            --window-position=0,0 \
            --window-size=1920,1080 \
            --force-device-scale-factor=$SCALE_FACTOR \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-gl=swiftshader \
            --disable-web-security \
            --allow-running-insecure-content \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-first-run-ui \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-restore-session-state \
            --disable-notifications \
            --disable-features=AudioServiceOutOfProcess \
            --enable-features=UsePulseAudio \
            --autoplay-policy=no-user-gesture-required \
            --user-data-dir=/tmp/chrome_clean_profile \
            "${{ github.event.inputs.video_url }}" &
          
          echo "Attesa di 15 secondi per il caricamento della pagina..."
          sleep 15

          # 5. Costruzione destinazioni con TEE Muxer e onfail=ignore (Fault-Tolerant)
          # --- 0. AUTOMAZIONE HEADLESS PER INSTAGRAM & TIKTOK ---
          if [ -z "${{ github.event.inputs.ig_key }}" ] && [ -f scripts/instagram_live_auto.js ]; then
            echo "? Avvio automazione headless Instagram Live..."
            node scripts/instagram_live_auto.js &
            sleep 5
          fi

          if [ -z "${{ github.event.inputs.tk_key }}" ] && [ -f scripts/tiktok_live_adapter.js ]; then
            echo "? Avvio automazione headless TikTok Live Adapter..."
            node scripts/tiktok_live_adapter.js &
            sleep 8
          fi

          TEE_DESTS=()

          # --- 1. FACEBOOK LIVE ---
          FB_KEY="${{ github.event.inputs.fb_key }}"
          if [ -z "$FB_KEY" ]; then
            FB_KEY="FB-1761836115505207-0-Ab4NotixqCElXbBE4ynoHVYe"
          fi
          FB_URL=""
          if [[ "$FB_KEY" == rtmp* ]]; then
            FB_URL="$FB_KEY"
          else
            FB_URL="rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
          fi
          echo "? Output configurato: Facebook Live ($FB_URL)"
          TEE_DESTS+=("[f=flv:onfail=ignore]${FB_URL}")

          # --- 2. YOUTUBE LIVE ---
          YT_KEY="${{ github.event.inputs.yt_key }}"
          if [ -z "$YT_KEY" ]; then
            YT_KEY="umqe-k4ke-qba4-39db-abrp"
          fi
          YT_URL=""
          if [[ "$YT_KEY" == rtmp* ]]; then
            YT_URL="$YT_KEY"
          else
            YT_URL="rtmp://a.rtmp.youtube.com/live2/$YT_KEY"
          fi
          echo "? Output configurato: YouTube Live ($YT_URL)"
          TEE_DESTS+=("[f=flv:onfail=ignore]${YT_URL}")
          TEE_DESTS+=("[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/uqc8-0m56-2bga-kvy3-1pgf")
          TEE_DESTS+=("[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/umqe-k4ke-qba4-39db-abrp")

          # --- 3. TIKTOK LIVE ---
          TK_KEY="${{ github.event.inputs.tk_key }}"
          if [ -z "$TK_KEY" ] && [ -f /tmp/tiktok_rtmp.txt ]; then
            TK_KEY=$(cat /tmp/tiktok_rtmp.txt | tr -d '\r\n')
            echo "? Endpoint TikTok RTMP recuperato da adapter: $TK_KEY"
          fi
          if [ -n "$TK_KEY" ]; then
            TK_URL=""
            if [[ "$TK_KEY" == rtmp* ]]; then
              TK_URL="$TK_KEY"
            else
              TK_URL="rtmp://live-push.tiktok-cdns.com/live/$TK_KEY"
            fi
            echo "? Output configurato: TikTok Live ($TK_URL)"
            TEE_DESTS+=("[f=flv:onfail=ignore]${TK_URL}")
          fi

          # --- 4. INSTAGRAM LIVE ---
          IG_KEY="${{ github.event.inputs.ig_key }}"
          if [ -z "$IG_KEY" ] && [ -f /tmp/instagram_rtmp.txt ]; then
            IG_KEY=$(cat /tmp/instagram_rtmp.txt | tr -d '\r\n')
            echo "? Endpoint Instagram RTMP recuperato da adapter: $IG_KEY"
          fi
          if [ -n "$IG_KEY" ]; then
            IG_URL=""
            if [[ "$IG_KEY" == rtmp* ]]; then
              IG_URL="$IG_KEY"
            else
              IG_URL="rtmps://live-upload.instagram.com:443/rtmp/$IG_KEY"
            fi
            echo "? Output configurato: Instagram Live ($IG_URL)"
            TEE_DESTS+=("[f=flv:onfail=ignore]${IG_URL}")
          fi

          if [ ${#TEE_DESTS[@]} -eq 0 ]; then
            echo "? Errore: Nessuna chiave o destinazione RTMP fornita!"
            exit 1
          fi

          # Unione delle destinazioni separate dal carattere pipe '|'
          IFS="|"
          TEE_STRING="${TEE_DESTS[*]}"

          DUR_HOURS="${{ github.event.inputs.duration_hours }}"
          if [ -z "$DUR_HOURS" ]; then
            DUR_HOURS="6"
          fi
          DUR_SECS=$(awk "BEGIN {print int($DUR_HOURS * 3600)}")
          echo "?? Durata programmata dello streaming: $DUR_HOURS ore ($DUR_SECS secondi)"

          QUALITY="${{ github.event.inputs.stream_quality }}"
          if [ -z "$QUALITY" ]; then QUALITY="1080p_std"; fi

          if [ "$QUALITY" = "1080p_high" ]; then
            BITRATE="6000k"; MINRATE="5000k"; MAXRATE="6500k"; BUFSIZE="12000k"; VF="scale=1920:1080:flags=lanczos"
          elif [ "$QUALITY" = "720p_hq" ]; then
            BITRATE="3200k"; MINRATE="2800k"; MAXRATE="3600k"; BUFSIZE="6400k"; VF="scale=1280:720:flags=bicubic"
          elif [ "$QUALITY" = "720p_eco" ]; then
            BITRATE="2000k"; MINRATE="1600k"; MAXRATE="2400k"; BUFSIZE="4000k"; VF="scale=1280:720:flags=bicubic"
          else
            BITRATE="4500k"; MINRATE="4000k"; MAXRATE="5000k"; BUFSIZE="9000k"; VF="scale=1920:1080:flags=lanczos"
          fi

          # --- 6. BACKGROUND SNAPSHOT DAEMON (OGNI 10 MINUTI) ---
          # Cattura ogni 10 minuti uno snapshot reale da X11 :99 e lo invia a Google Apps Script
          # per pubblicare la storia su Facebook e YouTube
          (
            sleep 60
            while true; do
              echo "📸 [SNAPSHOT 10 MIN] Cattura screen da X11 :99..."
              ffmpeg -y -f x11grab -draw_mouse 0 -video_size 1920x1080 -i :99 -vframes 1 /tmp/live_snapshot.jpg >/dev/null 2>&1 || true
              if [ -f /tmp/live_snapshot.jpg ]; then
                B64_DATA=$(base64 -w 0 /tmp/live_snapshot.jpg)
                WEBHOOK_URL="https://script.google.com/macros/s/AKfycbwTAyOTWpm3mNGX-DAWbZ7XOtrog52md5-P_jUEHoEhsoXCrJGj_bLClOiDvo5FKUbpWg/exec"
                PAYLOAD_JSON=$(jq -n --arg b64 "$B64_DATA" '{action: "pubblica_snapshot_live_10min", base64Image: $b64, forza: false}')
                curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD_JSON" "$WEBHOOK_URL" >/dev/null 2>&1 || true
                echo "📸 [SNAPSHOT 10 MIN] Inviato a Google Apps Script!"
                rm -f /tmp/live_snapshot.jpg
              fi
              sleep 600
            done
          ) &

          echo "? Avvio encoding FFmpeg CBR $BITRATE ($QUALITY) senza crop con TEE Muxer e Timer di $DUR_HOURS ore..."
          timeout --kill-after=30s "${DUR_SECS}s" ffmpeg -thread_queue_size 2048 \
            -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
            -thread_queue_size 2048 \
            -f pulse -i VirtualSink.monitor \
            -vf "$VF" \
            -c:v libx264 -preset veryfast \
            -b:v $BITRATE -minrate $MINRATE -maxrate $MAXRATE -bufsize $BUFSIZE \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 160k -ar 44100 -ac 2 \
            -vsync cfr \
            -flags +global_header \
            -f tee -map 0:v -map 1:a "$TEE_STRING" || true

          echo "Stream terminato regolarmente dopo $DUR_HOURS ore."

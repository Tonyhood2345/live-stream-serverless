  // Risolve il personaggio da qualsiasi stringa (case-insensitive e alias)
  function resolveCharacter(query) {
    if (!query) return window.AVATAR_STUDIO_CONFIG.characters.daria;
    var q = String(query).trim().toLowerCase();
    
    if (window.AVATAR_STUDIO_CONFIG.characters[q]) {
      return window.AVATAR_STUDIO_CONFIG.characters[q];
    }
    
    var chars = window.AVATAR_STUDIO_CONFIG.characters;
    for (var k in chars) {
      if (chars[k].nome.toLowerCase() === q || chars[k].label.toLowerCase().includes(q)) {
        return chars[k];
      }
    }

    if (q.includes('dar') && q.includes('ia')) return chars.daria;
    if (q.includes('dar') && q.includes('io')) return chars.dario;
    if (q.includes('bea') || q.includes('elen') || q.includes('helen')) return chars.beatrice;
    if (q.includes('tin') || q.includes('giul') || q.includes('jul')) return chars.tina;
    if (q.includes('chiar') || q.includes('sof') || q.includes('soph')) return chars.chiara;
    if (q.includes('wal') || q.includes('marc') || q.includes('mark')) return chars.walter;
    if (q.includes('ugo') || q.includes('aless') || q.includes('alex')) return chars.ugo;
    if (q.includes('leo')) return chars.leo;

    return chars.dario;
  }

  function getCharacterImage(charObj) {
    if (!charObj) return '';
    if (window.AVATAR_ROSTER) {
      var all = (window.AVATAR_ROSTER.donne || []).concat(window.AVATAR_ROSTER.uomini || []);
      var match = all.find(function(a){ return a.id === charObj.assetRef || a.id === charObj.id; });
      if (match && match.img) return match.img;
    }
    return '';
  }

  // 1. REGOLE LAYOUT: BOX DESTRO SWAP RAPIDO FADE CROSS (300ms)
  function applicaOspiteDestro(charObj, onComplete) {
    if (!charObj) charObj = window.AVATAR_STUDIO_CONFIG.characters.dario;
    // GUARDIA ASSOLUTA: Daria e la conduttrice fissa del Box Sinistro e non deve MAI apparire nel Box Destro!

      return;
    }

    _currentRightSpeaker = charObj.id;
    var unitDestro = document.getElementById('unit-dario');
    var boxDestro = document.getElementById('box-destro-ospiti');
    var elBaseO = document.getElementById('p-or-base');
    var elSpkO = document.getElementById('p-or-spk');
    var elBlinkO = document.getElementById('p-or-blink');
    var elArmsO = document.getElementById('p-or-arms');
    var lipO = document.getElementById('lip-rig-dario');
    var micSpanO = document.querySelector('#mic-dario span');

    if (!unitDestro) {
      if (onComplete) onComplete();
      return;
    }

    // Inizia dissolvenza in uscita (150ms)
    unitDestro.classList.add('fade-cross-swap', 'fading-out');

    setTimeout(function() {
      var isDario = (charObj.id === 'dario');
      var imgSrc = getCharacterImage(charObj);

      if (boxDestro) {
        if (charObj.needsMirror) {
          boxDestro.classList.add('mirrored-host');
        } else {
          boxDestro.classList.remove('mirrored-host');
        }
      }

      if (!isDario && imgSrc) {
        if (elBaseO) {
          elBaseO.src = imgSrc;
          elBaseO.classList.add('photo-avatar');
        }
        if (elSpkO) elSpkO.style.display = 'none';
        if (elBlinkO) elBlinkO.style.display = 'none';
        if (elArmsO) elArmsO.style.display = 'none';
      } else {
        if (elBaseO) {
          elBaseO.src = (typeof B64_IMAGES !== 'undefined' && B64_IMAGES.or_base) ? "data:image/png;base64," + B64_IMAGES.or_base : imgSrc;
          elBaseO.classList.remove('photo-avatar');
        }
        if (elSpkO) elSpkO.style.display = '';
        if (elBlinkO) elBlinkO.style.display = '';
        if (elArmsO) elArmsO.style.display = '';
      }

      // Ricalibrazione anatomica del centramento facciale e coordinate del lip-rig
      if (lipO && charObj.mouthX && charObj.mouthY) {
        var effMouthX = charObj.needsMirror ? (100 - charObj.mouthX) : charObj.mouthX;
        lipO.style.left = effMouthX + '%';
        lipO.style.top = charObj.mouthY + '%';
      }

      if (micSpanO) {
        micSpanO.innerHTML = charObj.nome + ' &bull; ' + charObj.ruolo.split('(')[0].trim();
      }

      // Dissolvenza in entrata (150ms) -> Totale Cross-Fade esatto: 300ms
      unitDestro.classList.remove('fading-out');
      unitDestro.classList.add('fading-in');

      setTimeout(function() {
        unitDestro.classList.remove('fading-in', 'fade-cross-swap');
        if (onComplete) onComplete();
      }, 150);

    }, 150);
  }

  // Ritorno automatico a Dario
  function ripristinaDarioDestro(onComplete) {
    var darioChar = window.AVATAR_STUDIO_CONFIG.characters.dario;
    applicaOspiteDestro(darioChar, onComplete);
  }

  // 2. LOGICA SCHERMO CENTRALE: IDLE (LOGO AGENZIA) vs ATTIVO (MEDIA + SCHEDA TECNICA)
  function impostaSchermoCentrale(mediaUrl, schedaInfo) {
    var screenIdle = document.getElementById('screen-state-idle');
    var screenActive = document.getElementById('screen-state-active');
    var imgEl = document.getElementById('screen-media-img');
    var vidEl = document.getElementById('screen-media-video');
    var roomNameEl = document.getElementById('tech-room-name');
    var mqEl = document.getElementById('tech-badge-mq');
    var energyEl = document.getElementById('tech-badge-energy');
    var priceEl = document.getElementById('tech-badge-price');

    if (!screenIdle || !screenActive) return;

    if (!mediaUrl && !schedaInfo) {
      // STATO IDLE / DEFAULT: Mostra Logo Ufficiale Immobiliare Giancani con loop animato
      screenActive.style.opacity = '0';
      setTimeout(function() {
        screenActive.style.display = 'none';
        screenIdle.style.display = 'flex';
        screenIdle.style.opacity = '1';
      }, 300);
      _activeMediaUrl = null;
      return;
    }

    // STATO DINAMICO ATTIVO: Foto/Clip + Scheda Tecnica Sovraimpressa
    var isVideo = mediaUrl && (mediaUrl.endsWith('.mp4') || mediaUrl.includes('video'));
    if (imgEl && vidEl) {
      if (isVideo) {
        imgEl.style.display = 'none';
        vidEl.style.display = 'block';
        vidEl.src = mediaUrl;
        vidEl.play().catch(function(){});
      } else if (mediaUrl) {
        vidEl.style.display = 'none';
        imgEl.style.display = 'block';
        imgEl.src = mediaUrl;
      }
    }

    if (schedaInfo) {
      if (roomNameEl && schedaInfo.stanza) roomNameEl.textContent = schedaInfo.stanza.toUpperCase();
      if (mqEl) {
        var rawMq = schedaInfo.mq ? String(schedaInfo.mq).replace(/\bmetri\s*quadri\b/gi, '').replace(/\b(?:mq|m²|m2)\b/gi, '').trim() : '120';
        mqEl.textContent = rawMq + ' metri quadri'; // Regola: Metri Quadri esteso
      }
      if (energyEl && schedaInfo.classeEnergetica) energyEl.textContent = 'Classe ' + schedaInfo.classeEnergetica;
      if (priceEl && schedaInfo.prezzo) priceEl.textContent = String(schedaInfo.prezzo);
    }

    screenIdle.style.opacity = '0';
    setTimeout(function() {
      screenIdle.style.display = 'none';
      screenActive.style.display = 'flex';
      screenActive.style.opacity = '1';
    }, 200);

    _activeMediaUrl = mediaUrl;
  }

  // 3. SOTTOTITOLI DINAMICI E PERSONALIZZAZIONE COLORI (TOP BAR)
  function renderizzaSottotitolo(charObj, text) {
    if (!charObj) charObj = window.AVATAR_STUDIO_CONFIG.characters.daria;
    var badge = document.getElementById('sub-speaker-badge');
    var stream = document.getElementById('sub-text-stream');

    if (badge) {
      badge.textContent = charObj.label;
      badge.style.background = charObj.colore;
      badge.style.color = charObj.coloreBadgeText || '#000';
    }
    if (stream) {
      stream.textContent = text || '';
      stream.style.color = charObj.colore;
    }
  }

  // 4. TRIGGER E TRANSIZIONE SCENA UNIFICATA
  // Input evento: { speaker: "NOME", text: "...", media_url: "...", duration: SECONDI, scheda: {...} }
  function eseguiTriggerScena(evento, onFinish) {
    if (!evento) return;
    var charObj = resolveCharacter(evento.speaker);
    var isDaria = (charObj.id === 'daria');
    var isGuest = (!isDaria && charObj.id !== 'dario');

    // 1. Aggiorna riquadro destro in base a speaker
    if (isGuest) {
      applicaOspiteDestro(charObj);
    } else if (charObj.id === 'dario') {
      ripristinaDarioDestro();
    }

    // 2. Aggiorna lo schermo centrale
    if (evento.media_url || evento.scheda || evento.isDescription) {
      impostaSchermoCentrale(evento.media_url, evento.scheda);
    } else {
      impostaSchermoCentrale(null, null); // Torna a stato Idle Logo
    }

    // 3. Stampa il testo nella top bar con il codice colore corrispondente
    renderizzaSottotitolo(charObj, evento.text);

    // Gestione visuale speaking
    var unitD = document.getElementById('unit-daria');
    var unitO = document.getElementById('unit-dario');
    if (isDaria) {
      if (unitD) unitD.classList.add('speaking');
      if (unitO) unitO.classList.remove('speaking');
      if (window.DariaCloseUpManager) {
        window.DariaCloseUpManager.attivaSeArmato('daria', evento.text);
      }
    } else {
      if (unitO) unitO.classList.add('speaking');
      if (unitD) unitD.classList.remove('speaking');
    }

    // Callback di fine traccia
    var handleEnd = function() {
      if (unitD) unitD.classList.remove('speaking');
      if (unitO) unitO.classList.remove('speaking');

      if (window.DariaCloseUpManager && window.DariaCloseUpManager.isAttivo()) {
        window.DariaCloseUpManager.disattivaPrimoPiano();
      }

      // 5. A fine traccia, se era un ospite e lo step successivo non è un altro ospite, reimposta Dario a destra
      if (isGuest) {
        ripristinaDarioDestro();
      }

      if (onFinish) onFinish();
    };

    return {
      character: charObj,
      handleEnd: handleEnd
    };
  }

  return {
    resolveCharacter: resolveCharacter,
    applicaOspiteDestro: applicaOspiteDestro,
    ripristinaDarioDestro: ripristinaDarioDestro,
    impostaSchermoCentrale: impostaSchermoCentrale,
    renderizzaSottotitolo: renderizzaSottotitolo,
    eseguiTriggerScena: eseguiTriggerScena
  };
})();

/* ═══════════════════════════════════════════════════════════════════════
   🎬 REGIA BROADCAST: CONTROLLER CLOSE-UP DINAMICO DARIA (1/4 SCHERMO)
   Cadenza variabile ogni ~2 minuti (90s - 150s), Zoom, Movimento & Ritorno
   ═══════════════════════════════════════════════════════════════════════ */
window.DariaCloseUpManager = (function() {
  var _isArmed = false;
  var _isActive = false;
  var _timer = null;
  var _safetyTimeout = null;
  var _lastTriggerTime = Date.now();

  // Genera tempo dinamico sempre diverso: media 2 minuti (90s - 150s)
  function _calcolaProssimoIntervallo() {
    return Math.floor(Math.random() * (150000 - 90000 + 1)) + 90000;
  }

  function pianificaProssimoPrimoPiano() {
    if (_timer) clearTimeout(_timer);
    var delay = _calcolaProssimoIntervallo();
    console.log('[REGIA-DARIA] 🎬 Prossimo Primo Piano programmato tra ' + Math.round(delay / 1000) + 's (cadenza dinamica sempre varia ~2 min) — Immobiliare Giancani');
    _timer = setTimeout(function() {
      _isArmed = true;
      console.log('[REGIA-DARIA] 🎯 Primo Piano ARMATO: scatta alla prossima frase di Daria! — Immobiliare Giancani');
    }, delay);
  }

  function attivaSeArmato(speakerName, testoFrase) {
    var isDaria = !speakerName || speakerName.toLowerCase().indexOf('daria') !== -1;
    if (!isDaria) return false;

    var tempoTrascors = Date.now() - _lastTriggerTime;
    // Scatta se armato dal timer variabile o come fallback se trascorsi oltre 3 minuti
    if (_isArmed || tempoTrascors > 180000) {
      attivaPrimoPiano();
      return true;
    }
    return false;
  }

  function attivaPrimoPiano() {
    if (_isActive) return;
    _isActive = true;
    _isArmed = false;
    _lastTriggerTime = Date.now();

    console.log('[REGIA-DARIA] 🌟 ATTIVAZIONE PRIMO PIANO 1/4 SCHERMO (Zoom + Movimento + Sfumatura) — Immobiliare Giancani');

    var unitD = document.getElementById('unit-daria') || document.getElementById('daria-unit');
    var boxD = document.getElementById('box-sinistro-daria') || document.getElementById('daria-anchor-slot');
    var backdrop = document.getElementById('daria-focus-backdrop');

    if (backdrop) backdrop.classList.add('active');

    if (boxD) {
      boxD.classList.remove('daria-cinematic-return');
      boxD.classList.add('daria-cinematic-focus');
    }
    if (unitD) {
      unitD.classList.remove('daria-cinematic-return');
      unitD.classList.add('daria-cinematic-focus');
    }

    // Timer di sicurezza: se la frase è lunghissima o non termina, chiude comunque dopo 14s max
    if (_safetyTimeout) clearTimeout(_safetyTimeout);
    _safetyTimeout = setTimeout(function() {
      disattivaPrimoPiano();
    }, 14000);
  }

  function disattivaPrimoPiano() {
    if (!_isActive) return;
    _isActive = false;
    if (_safetyTimeout) clearTimeout(_safetyTimeout);

    console.log('[REGIA-DARIA] ↩️ RITORNO FLUIDO AL PODIO STUDIO (Zoom Out & Ripristino) — Immobiliare Giancani');

    var unitD = document.getElementById('unit-daria') || document.getElementById('daria-unit');
    var boxD = document.getElementById('box-sinistro-daria') || document.getElementById('daria-anchor-slot');
    var backdrop = document.getElementById('daria-focus-backdrop');

    if (backdrop) backdrop.classList.remove('active');

    if (boxD) {
      boxD.classList.remove('daria-cinematic-focus');
      boxD.classList.add('daria-cinematic-return');
    }
    if (unitD) {
      unitD.classList.remove('daria-cinematic-focus');
      unitD.classList.add('daria-cinematic-return');
    }

    // Rimuovi la classe return al termine dell'animazione (850ms)
    setTimeout(function() {
      if (boxD) boxD.classList.remove('daria-cinematic-return');
      if (unitD) unitD.classList.remove('daria-cinematic-return');
    }, 900);

    // Pianifica il prossimo primo piano con nuovo intervallo dinamico
    pianificaProssimoPrimoPiano();
  }

  // Avvio programmazione automatica
  setTimeout(function() {
    pianificaProssimoPrimoPiano();
  }, 20000); // Primo innesco dopo 20s dall'avvio della diretta

  return {
    attivaSeArmato: attivaSeArmato,
    attivaPrimoPiano: attivaPrimoPiano,
    disattivaPrimoPiano: disattivaPrimoPiano,
    isAttivo: function() { return _isActive; },
    forzaTrigger: function() { attivaPrimoPiano(); }
  };
})();
</script>

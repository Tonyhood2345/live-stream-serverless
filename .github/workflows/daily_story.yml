name: 🎬 Pipeline Reels Multi-Modalità (Mitologia, Libri, Bibbia, Pillole)

on:
  # Schedulazione automatica nei picchi di engagement (Orari Italiani UTC+1 / UTC+2 CEST):
  # - 05:15 UTC (07:15 Roma): Pillole Immobiliari & Legali (mattina/risveglio)
  # - 11:30 UTC (13:30 Roma): Mitologia Greca & Epica (pausa pranzo)
  # - 16:30 UTC (18:30 Roma): Grandi Libri Classici con Gatto (rientro a casa/relax)
  # - 19:00 UTC (21:00 Roma): Storie Bibliche (prima serata)
  schedule:
    - cron: '15 5 * * *'
    - cron: '30 11 * * *'
    - cron: '30 16 * * *'
    - cron: '0 19 * * *'

  # Trigger manuale dalla dashboard GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità bot (lascia "auto" per selezione automatica in base all orario)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - mitologia
          - standard
          - bibbia
          - pillole
      story_id:
        description: 'ID specifico della storia o pillola (lascia vuoto per casuale)'
        required: false
        default: ''
      voice:
        description: 'Voce Edge-TTS'
        required: false
        default: 'it-IT-ElsaNeural'
        type: choice
        options:
          - it-IT-ElsaNeural
          - it-IT-DiegoNeural

jobs:
  genera_e_pubblica_video:
    runs-on: ubuntu-latest
    name: 🎬 Genera Video Verticale e Pubblica

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎞️ Installa FFmpeg di sistema e Font Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: 📦 Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pillow edge-tts requests urllib3 aiohttp google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib httplib2

      - name: 🚀 Esecuzione Pipeline Bot Reels
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YOUTUBE_TOKEN_GIANCANI_JSON: ${{ secrets.YOUTUBE_TOKEN_GIANCANI_JSON }}
          YOUTUBE_TOKEN_MITOLOGIA_JSON: ${{ secrets.YOUTUBE_TOKEN_MITOLOGIA_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # 1. Determinazione modalità
          INPUT_MODE="${{ github.event.inputs.mode }}"
          
          if [ -z "$INPUT_MODE" ] || [ "$INPUT_MODE" = "auto" ]; then
            # Rilevamento ora UTC per scheduling automatico
            ORA_UTC=$(date -u +%H)
            echo "Esecuzione programmata - Ora UTC rilevata: $ORA_UTC"
            
            if [ "$ORA_UTC" -ge 4 ] && [ "$ORA_UTC" -le 8 ]; then
              TARGET_MODE="pillole"
            elif [ "$ORA_UTC" -ge 9 ] && [ "$ORA_UTC" -le 13 ]; then
              TARGET_MODE="mitologia"
            elif [ "$ORA_UTC" -ge 14 ] && [ "$ORA_UTC" -le 17 ]; then
              TARGET_MODE="standard"
            else
              TARGET_MODE="bibbia"
            fi
          else
            TARGET_MODE="$INPUT_MODE"
          fi

          echo "🎯 Modalità attiva per l'episodio: $TARGET_MODE"

          # 2. Controllo file di esecuzione (main.py o bot.py)
          SCRIPT_TARGET="main.py"
          if [ ! -f "main.py" ] && [ -f "bot.py" ]; then
            SCRIPT_TARGET="bot.py"
          fi

          # 3. Composizione comando CLI
          CMD="python $SCRIPT_TARGET --mode $TARGET_MODE"

          if [ -n "${{ github.event.inputs.story_id }}" ]; then
            CMD="$CMD --id ${{ github.event.inputs.story_id }}"
          fi

          if [ -n "${{ github.event.inputs.voice }}" ]; then
            CMD="$CMD --voice ${{ github.event.inputs.voice }}"
          else
            CMD="$CMD --voice it-IT-ElsaNeural"
          fi

          echo "Esecuzione comando: $CMD"
          $CMD

      - name: 💾 Archivia Video Generato come Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-reels-generato
          path: video_storie_output/*.mp4
          retention-days: 7

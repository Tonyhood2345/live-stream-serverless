// 📤 UPLOAD MOBILE & GESTIONE FILE
function gestisciAnteprimaUploadFiles(inputEl) {
  var files = inputEl.files;
  var container = document.getElementById('upload-video-notes-container');
  if (!container) return;
  container.innerHTML = '';
  container.style.display = 'none';

  if (!files || files.length === 0) return;

  var videoCount = 0;
  for (var i = 0; i < files.length; i++) {
    if (files[i].type && files[i].type.indexOf('video') !== -1) {
      videoCount++;
      var div = document.createElement('div');
      div.className = 'form-group';
      div.style.marginBottom = '8px';
      div.innerHTML = '<label style="color: var(--gold-bright);">🎥 Didascalia Video (' + files[i].name + '):</label>' +
                      '<input type="text" id="note-video-' + i + '" placeholder="es. Vista cucina drone, balcone e vista panoramica" value="Panoramica interni ed esterni con ripresa drone">';
      container.appendChild(div);
    }
  }

  if (videoCount > 0) {
    container.style.display = 'block';
  }
}

/**
 * 🎨 Applica watermark logo Immobiliare Giancani e ridimensiona l'immagine
 * a massimo 1920px per lato preservando l'aspect ratio originale.
 * Questo previene categoricamente il superamento dei limiti di memoria di google.script.run (~2MB).
 */
function applicaWatermarkImage(file, callback) {
  if (!file) {
    if (typeof callback === 'function') callback('');
    return;
  }

  // Identifica se è un'immagine
  var isImg = file.type && file.type.indexOf('image') !== -1;
  if (!isImg && file.name) {
    var ext = file.name.split('.').pop().toLowerCase();
    if (['jpg', 'jpeg', 'png', 'webp', 'bmp', 'gif'].indexOf(ext) !== -1) {
      isImg = true;
    }
  }

  // Se non è un'immagine (video o altro), usa FileReader diretto con gestione errori
  if (!isImg) {
    var reader = new FileReader();
    reader.onload = function(e) {
      if (typeof callback === 'function') callback(e.target.result);
    };
    reader.onerror = function(err) {
      console.warn("Errore lettura file non-immagine:", err);
      if (typeof callback === 'function') callback('');
    };
    reader.readAsDataURL(file);
    return;
  }

  var reader = new FileReader();
  reader.onerror = function(err) {
    console.warn("Errore FileReader immagine:", err);
    if (typeof callback === 'function') callback('');
  };

  reader.onload = function(e) {
    var rawDataUrl = e.target.result;
    var img = new Image();
    img.crossOrigin = "anonymous";

    img.onerror = function(errImg) {
      console.warn("Impossibile decodificare immagine su Canvas, bypass watermark:", errImg);
      if (typeof callback === 'function') callback(rawDataUrl);
    };

    img.onload = function() {
      try {
        var origW = img.naturalWidth || img.width || 1200;
        var origH = img.naturalHeight || img.height || 800;

        // Limita a max 1920px per non saturare la memoria e rispettare il limite google.script.run
        var MAX_DIM = 1920;
        var targetW = origW;
        var targetH = origH;

        if (targetW > MAX_DIM || targetH > MAX_DIM) {
          if (targetW >= targetH) {
            targetH = Math.round((targetH * MAX_DIM) / targetW);
            targetW = MAX_DIM;
          } else {
            targetW = Math.round((targetW * MAX_DIM) / targetH);
            targetH = MAX_DIM;
          }
        }

        var canvas = document.getElementById('watermark-canvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.id = 'watermark-canvas';
          canvas.style.display = 'none';
          document.body.appendChild(canvas);
        }

        canvas.width = targetW;
        canvas.height = targetH;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, targetW, targetH);
        ctx.drawImage(img, 0, 0, targetW, targetH);

        var concludiUpload = function() {
          try {
            var dataUrlOut = canvas.toDataURL('image/jpeg', 0.85);
            if (typeof callback === 'function') callback(dataUrlOut);
          } catch(eCanvas) {
            console.warn("toDataURL fallito, uso rawDataUrl:", eCanvas);
            if (typeof callback === 'function') callback(rawDataUrl);
          }
        };

        var is360 = (file.name || '').toLowerCase().indexOf('360') !== -1;
        var logo = new Image();
        logo.crossOrigin = "anonymous";

        logo.onload = function() {
          try {
            if (is360) {
              var radius = targetW * 0.08;
              var cX = targetW / 2;
              var cY = targetH - (radius * 0.85);

              ctx.fillStyle = '#FFFFFF';
              ctx.beginPath();
              ctx.arc(cX, cY, radius, 0, 2 * Math.PI);
              ctx.fill();

              var logoW = radius * 1.4;
              var logoH = (logo.height / logo.width) * logoW;
              ctx.drawImage(logo, cX - (logoW / 2), cY - (logoH / 2), logoW, logoH);
            } else {
              var logoWidth = targetW * 0.28;
              var logoHeight = (logo.height / logo.width) * logoWidth;
              var posX = (targetW - logoWidth) / 2;
              var posY = (targetH - logoHeight) / 2;

              ctx.save();
              ctx.globalAlpha = 0.40;
              ctx.drawImage(logo, posX, posY, logoWidth, logoHeight);
              ctx.restore();
            }
          } catch(eDraw) {
            console.warn("Disegno logo non riuscito:", eDraw);
          }
          concludiUpload();
        };

        logo.onerror = function() {
          console.warn("Logo non raggiungibile per CORS, procedo senza watermark.");
          concludiUpload();
        };

        logo.src = LOGO_GIANCANI_URL;

      } catch(eOuter) {
        console.warn("Errore elaborazione canvas:", eOuter);
        if (typeof callback === 'function') callback(rawDataUrl);
      }
    };

    img.src = rawDataUrl;
  };

  reader.readAsDataURL(file);
}

// 📋 SCHEDA IMMOBILE & REGIA DARIA
function apriModalSchedaImmobileStudio(azione) {
  _schedaStudioPendingAction = azione || 'modifica_corrente';
  var modal = document.getElementById('modal-scheda-immobile-studio');
  if (!modal) return;

  var tabName = '';
  if (azione === 'upload') {
    tabName = (document.getElementById('upload-folder-name') ? document.getElementById('upload-folder-name').value : '').trim();
  } else if (azione === 'sync') {
    tabName = (document.getElementById('sync-drive-folder-input') ? document.getElementById('sync-drive-folder-input').value : '').trim();
  } else {
    tabName = _galleriaTabCorrente || (document.getElementById('select-immobile-galleria') ? document.getElementById('select-immobile-galleria').value : '');
  }

  // Precompila se l'immobile esiste già
  if (tabName && typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(scheda) {
        if (scheda && typeof scheda === 'object') {
          if (scheda.tipoImmobile && document.getElementById('scheda-tipo-immobile')) document.getElementById('scheda-tipo-immobile').value = scheda.tipoImmobile;
          if (scheda.metriQuadri && document.getElementById('scheda-mq-immobile')) document.getElementById('scheda-mq-immobile').value = scheda.metriQuadri.replace(/\s*metri quadri/i, '').trim();
          if (scheda.zona && document.getElementById('scheda-zona-immobile')) document.getElementById('scheda-zona-immobile').value = scheda.zona;
          if (scheda.prezzo && document.getElementById('scheda-prezzo-immobile')) document.getElementById('scheda-prezzo-immobile').value = scheda.prezzo;
          if (scheda.stato && document.getElementById('scheda-stato-immobile')) document.getElementById('scheda-stato-immobile').value = scheda.stato;
          if (scheda.statoDettaglio && document.getElementById('scheda-stato-dettaglio')) document.getElementById('scheda-stato-dettaglio').value = scheda.statoDettaglio;
          if (scheda.noteDaria && document.getElementById('scheda-note-daria')) document.getElementById('scheda-note-daria').value = scheda.noteDaria;
        }
      })
      .getSchedaImmobileDati(tabName);
  }

  modal.style.display = 'flex';
}

function chiudiModalSchedaImmobileStudio() {
  var modal = document.getElementById('modal-scheda-immobile-studio');
  if (modal) modal.style.display = 'none';
  _schedaStudioPendingAction = null;
}

function normalizzaMqVisuale(el) {
  if (el && el.value) {
    el.value = el.value.replace(/m[q²]/gi, '').trim();
  }
}

function getDatiSchedaImmobileStudioForm() {
  var tipoEl = document.getElementById('scheda-tipo-immobile');
  var tipo = (tipoEl ? tipoEl.value : '') || 'Appartamento';

  var mqInput = document.getElementById('scheda-mq-immobile');
  var mqVal = (mqInput ? mqInput.value : '').trim();
  var mqNum = mqVal.replace(/[^\d.,]/g, '').trim();
  var metriQuadri = mqNum ? (mqNum + ' metri quadri') : (mqVal ? (mqVal.toLowerCase().indexOf('metri quadri') !== -1 ? mqVal : mqVal + ' metri quadri') : '120 metri quadri');

  var pInput = document.getElementById('scheda-prezzo-immobile');
  var pVal = (pInput ? pInput.value : '').trim();
  var prezzo = pVal ? (pVal.indexOf('€') !== -1 ? pVal : '€ ' + pVal) : 'Trattativa Riservata';

  var zInput = document.getElementById('scheda-zona-immobile');
  var zona = (zInput ? zInput.value : '').trim();

  var sInput = document.getElementById('scheda-stato-immobile');
  var stato = (sInput ? sInput.value : '') || 'rifinito e ristrutturato a nuovo';

  var sdInput = document.getElementById('scheda-stato-dettaglio');
  var statoDettaglio = (sdInput ? sdInput.value : '').trim();

  var nInput = document.getElementById('scheda-note-daria');
  var noteDaria = (nInput ? nInput.value : '').trim();

  return {
    tipoImmobile: tipo,
    metriQuadri: metriQuadri,
    zona: zona,
    prezzo: prezzo,
    stato: stato,
    statoDettaglio: statoDettaglio,
    noteDaria: noteDaria
  };
}

function confermaSchedaImmobileStudio() {
  var datiScheda = getDatiSchedaImmobileStudioForm();
  var action = _schedaStudioPendingAction;
  chiudiModalSchedaImmobileStudio();

  if (action === 'upload') {
    eseguiUploadProprietaEFileConScheda(datiScheda);
  } else if (action === 'sync') {
    eseguiSincronizzazioneDriveEsistenteConScheda(datiScheda);
  } else {
    var tabTarget = _galleriaTabCorrente || (document.getElementById('select-immobile-galleria') ? document.getElementById('select-immobile-galleria').value : '');
    if (!tabTarget) { alert("Nessun immobile attivo selezionato."); return; }
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            alert("✅ Scheda Immobile e Regia DarIA salvate con successo per " + tabTarget + "!");
          } else {
            alert("⚠️ Errore salvataggio: " + (res ? res.error : ''));
          }
        })
        .salvaSchedaImmobileDati(tabTarget, datiScheda);
    }
  }
}

// 🚀 CARICAMENTO SU DRIVE & RIGENERA REGIA LIVE
function avviaUploadProprietaEFile() {
  var folderNameInput = document.getElementById('upload-folder-name');
  var folderName = folderNameInput ? folderNameInput.value.trim() : '';
  var fileInput = document.getElementById('upload-file-input');

  if (!folderName) { alert("Inserisci il nome della proprietà o cartella (es. Casa Poggio)."); return; }
  if (!fileInput || !fileInput.files || fileInput.files.length === 0) { alert("Seleziona almeno un file foto o video dallo smartphone."); return; }

  apriModalSchedaImmobileStudio('upload');
}

function eseguiUploadProprietaEFileConScheda(datiScheda) {
  var folderNameInput = document.getElementById('upload-folder-name');
  var folderName = folderNameInput ? folderNameInput.value.trim() : '';
  var fileInput = document.getElementById('upload-file-input');
  var btnUpload = document.getElementById('btn-avvia-upload');

  if (!folderName || !fileInput || !fileInput.files || fileInput.files.length === 0) return;

  var filesToProcess = Array.from(fileInput.files);
  var totalFiles = filesToProcess.length;

  var wrapper = document.getElementById('upload-progress-wrapper');
  var pBar = document.getElementById('upload-progress-bar');
  var pPct = document.getElementById('upload-progress-pct');
  var pTitle = document.getElementById('upload-progress-title');
  var pStep = document.getElementById('upload-progress-step');
  var pCount = document.getElementById('upload-progress-count');
  var reportBox = document.getElementById('upload-files-report-box');
  var summaryBox = document.getElementById('upload-final-summary');

  if (wrapper) wrapper.style.display = 'block';
  if (summaryBox) { summaryBox.style.display = 'none'; summaryBox.innerHTML = ''; }
  if (pBar) pBar.style.width = '0%';
  if (pPct) pPct.innerText = '0%';
  if (pTitle) pTitle.innerText = '⏳ Caricamento e Sincronizzazione Drive in corso...';
  if (pCount) pCount.innerText = '0 di ' + totalFiles;
  if (btnUpload) btnUpload.disabled = true;

  if (reportBox) {
    reportBox.innerHTML = filesToProcess.map(function(f, idx) {
      var sizeMb = (f.size / (1024 * 1024)).toFixed(2);
      var isVid = f.type && f.type.indexOf('video') !== -1;
      var is360 = (f.name || '').toLowerCase().indexOf('360') !== -1;
      var icon = isVid ? '🎥' : (is360 ? '🌐' : '🖼️');
      return '<div id="upload-item-row-' + idx + '" style="display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.05);">' +
               '<span style="color: var(--sand); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%;">' + icon + ' ' + f.name + ' <small style="color: #888;">(' + sizeMb + ' MB)</small></span>' +
               '<span id="upload-item-status-' + idx + '" style="color: #f1c40f; font-weight: 700;">⏳ In attesa...</span>' +
             '</div>';
    }).join('');
  }

  var filesSuccess = [];
  var filesFailed = [];
  var currentFileIdx = 0;

  function processNextFile() {
    if (currentFileIdx >= totalFiles) {
      if (pBar) pBar.style.width = '100%';
      if (pPct) pPct.innerText = '100%';
      if (pStep) pStep.innerText = '✅ Elaborazione completata!';
      if (btnUpload) btnUpload.disabled = false;

      if (summaryBox) {
        summaryBox.style.display = 'block';
        if (filesFailed.length === 0) {
          summaryBox.style.background = 'rgba(46, 204, 113, 0.2)';
          summaryBox.style.border = '1px solid #2ecc71';
          summaryBox.style.color = '#2ecc71';
          var lastItem = (filesSuccess.length > 0) ? filesSuccess[filesSuccess.length - 1] : {};
          var linkImmobile = lastItem.cartellaImmobileUrl ? '<a href="' + lastItem.cartellaImmobileUrl + '" target="_blank" style="color:var(--gold-bright); font-weight:800; text-decoration:underline;">📂 Apri Cartella Immobile Drive ↗</a>' : '';
          var linkBasi = lastItem.cartellaBasiMusicaliUrl ? '<a href="' + lastItem.cartellaBasiMusicaliUrl + '" target="_blank" style="color:#2ecc71; font-weight:800; text-decoration:underline;">🎵 Apri Cartella Basi Musicali Drive ↗</a>' : '';
          
          summaryBox.innerHTML = '🎉 <strong>NUOVO IMMOBILE &amp; CARTELLA CREATI SU GOOGLE DRIVE CON SUCCESSO!</strong><br>' +
                                 'Tutti i ' + filesSuccess.length + ' file sono stati caricati e archiviati sul Foglio <strong>' + folderName + '</strong> con testi descrittivi da Colonna F per DarIA!<br><br>' +
                                 '<div style="display:flex; justify-content:center; gap:16px; margin: 10px 0; flex-wrap:wrap;">' +
                                 linkImmobile + ' &nbsp;|&nbsp; ' + linkBasi +
                                 '</div>' +
                                 '<div style="margin-top:14px;">' +
                                 '  <button type="button" onclick="apriModalGeneraReelStudio(\'' + cleanTabTarget + '\')" class="btn-gold" style="padding:10px 20px; font-weight:900; background:linear-gradient(135deg, #2ecc71, #27ae60); color:#fff; border-radius:6px; cursor:pointer; box-shadow: 0 4px 15px rgba(46,204,113,0.4);">' +
                                 '    🎬 GENERA SUBITO VIDEO REEL (9:16) DA QUESTO IMMOBILE' +
                                 '  </button>' +
                                 '</div><br>— <strong>Immobiliare Giancani</strong>';
        } else {
          summaryBox.style.background = 'rgba(231, 76, 60, 0.2)';
          summaryBox.style.border = '1px solid #e74c3c';
          summaryBox.style.color = '#e74c3c';
          var errListHtml = filesFailed.map(function(f) { return '<li><strong>' + f.fileName + '</strong>: ' + f.error + '</li>'; }).join('');
          summaryBox.innerHTML = '⚠️ <strong>CARICAMENTO PARZIALE:</strong> ' + filesSuccess.length + ' caricati con successo, ' + filesFailed.length + ' non caricati.<br>' +
                                 '<ul style="text-align: left; margin-top: 6px; padding-left: 20px;">' + errListHtml + '</ul><br>— <strong>Immobiliare Giancani</strong>';
        }
      }

      if (typeof caricaElencoImmobiliDisponibili === 'function') caricaElencoImmobiliDisponibili();
      var cleanTabTarget = folderName.replace(/[\[\]\*?:/\\']/g, '').replace(/\s+/g, '_').trim().substring(0, 80);
      setTimeout(function() {
        caricaGalleriaAnteprimaMedia(cleanTabTarget);
      }, 1500);
      return;
    }

    var file = filesToProcess[currentFileIdx];
    var idx = currentFileIdx;
    var statusRow = document.getElementById('upload-item-status-' + idx);

    var pct = Math.round((idx / totalFiles) * 100);
    if (pBar) pBar.style.width = pct + '%';
    if (pPct) pPct.innerText = pct + '%';
    if (pCount) pCount.innerText = (idx + 1) + ' di ' + totalFiles;
    if (pStep) pStep.innerText = 'Elaborazione ' + file.name + '...';
    if (statusRow) statusRow.innerHTML = '🎨 Watermark & Ridimensionamento...';

    applicaWatermarkImage(file, function(base64Data) {
      if (!base64Data) {
        filesFailed.push({ fileName: file.name, error: "Lettura file fallita sul browser." });
        if (statusRow) statusRow.innerHTML = '<span style="color: #e74c3c;">❌ Errore lettura file</span>';
        currentFileIdx++;
        processNextFile();
        return;
      }

      var noteVideoEl = document.getElementById('note-video-' + idx);
      var noteVideoText = noteVideoEl ? noteVideoEl.value.trim() : '';

      var tipoMedia = 'foto';
      if (file.type && file.type.indexOf('video') !== -1) tipoMedia = 'video';
      else if ((file.name || '').toLowerCase().indexOf('360') !== -1) tipoMedia = '360';

      var payloadSingle = {
        fileName: file.name,
        mimeType: file.type || 'image/jpeg',
        base64Data: base64Data,
        noteVideo: noteVideoText,
        tipoMedia: tipoMedia
      };

      if (statusRow) statusRow.innerHTML = '🚀 Invio a Google Drive...';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              filesSuccess.push(res);
              if (statusRow) {
                statusRow.innerHTML = '<span style="color: #2ecc71;">✅ Caricato (' + (res.stanza || 'Ambiente') + ')</span>';
              }
            } else {
              filesFailed.push({ fileName: file.name, error: (res ? res.error : 'Errore sconosciuto') });
              if (statusRow) {
                statusRow.innerHTML = '<span style="color: #e74c3c;">❌ ' + (res ? res.error : 'Errore') + '</span>';
              }
            }
            currentFileIdx++;
            processNextFile();
          })
          .withFailureHandler(function(err) {
            var errMsg = (err && err.message) ? err.message : String(err);
            filesFailed.push({ fileName: file.name, error: errMsg });
            if (statusRow) {
              statusRow.innerHTML = '<span style="color: #e74c3c;">❌ ' + errMsg + '</span>';
            }
            currentFileIdx++;
            processNextFile();
          })
          .caricaSingoloFileSuDriveEProprieta({
            nomeCartella: folderName,
            file: payloadSingle,
            datiScheda: datiScheda
          });
      } else {
        filesSuccess.push({ fileName: file.name, stanza: 'Locale Mock' });
        if (statusRow) statusRow.innerHTML = '<span style="color: #2ecc71;">✅ Caricato (Mock)</span>';
        currentFileIdx++;
        processNextFile();
      }
    });
  }

  processNextFile();
}

// 📂 SINCRONIZZAZIONE DA CARTELLA DRIVE ESISTENTE
function caricaListaCartelleDriveInPicker() {
  var sel = document.getElementById('select-cartelle-drive-picker');
  var authBox = document.getElementById('drive-auth-alert-box');
  if (!sel) return;

  sel.innerHTML = '<option value="">⏳ Scansione cartelle Google Drive in corso...</option>';

  function popolaSelectCartelle(folders) {
    if (!sel) return;
    if (authBox) authBox.style.display = 'none';

    if (folders && folders.unauthorized) {
      if (authBox) authBox.style.display = 'block';
      sel.innerHTML = '<option value="">⚠️ Google Drive richiede autorizzazione (Vedi avviso sotto)</option>';
      return;
    }

    var list = Array.isArray(folders) ? folders : (folders && folders.folders ? folders.folders : []);
    if (!list || list.length === 0) {
      sel.innerHTML = '<option value="">📁 Incolla link o nome cartella nel campo a destra</option>';
      return;
    }

    sel.innerHTML = '<option value="">📱 Scegli una Cartella Google Drive (1-Tap)...</option>';
    list.forEach(function(f) {
      if (!f) return;
      var opt = document.createElement('option');
      opt.value = f.id || f.name;
      var cCount = (typeof f.fileCount === 'number' && f.fileCount > 0) ? (' (' + f.fileCount + ' file)') : '';
      opt.innerText = f.name + cCount;
      sel.appendChild(opt);
    });
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(folders) {
        popolaSelectCartelle(folders);
      })
      .withFailureHandler(function(err) {
        fetch('https://script.google.com/macros/s/AKfycbwTAyOTWpm3mNGX-DAWbZ7XOtrog52md5-P_jUEHoEhsoXCrJGj_bLClOiDvo5FKUbpWg/exec?action=get_drive_folders')
          .then(function(r){ return r.json(); })
          .then(function(data){ popolaSelectCartelle(data); })
          .catch(function(){ popolaSelectCartelle([]); });
      })
      .getListaCartelleDriveUtente();
  } else {
    fetch('https://script.google.com/macros/s/AKfycbwTAyOTWpm3mNGX-DAWbZ7XOtrog52md5-P_jUEHoEhsoXCrJGj_bLClOiDvo5FKUbpWg/exec?action=get_drive_folders')
      .then(function(r){ return r.json(); })
      .then(function(data){ popolaSelectCartelle(data); })
      .catch(function(){ popolaSelectCartelle([]); });
  }
}

function selezionaCartellaDriveDaPicker(folderId) {
  if (!folderId) return;
  var inp = document.getElementById('sync-drive-folder-input');
  if (inp) inp.value = folderId;
  caricaAnteprimaVisualeCartellaDrive(folderId);
}

function caricaAnteprimaVisualeCartellaDrive(folderIdOrName) {
  if (!folderIdOrName) return;
  var previewBox = document.getElementById('sync-folder-preview-box');
  var previewGrid = document.getElementById('sync-preview-grid');
  var countBadge = document.getElementById('sync-preview-count-badge');

  if (previewBox) previewBox.style.display = 'block';

function pulisciTestoPerOratoreBrowser(testo) {
  if (!testo) return '';
  var t = testo.toString().trim();
  t = t.replace(/https?:\/\/\S+|www\.\S+/gi, '');
  t = t.replace(/\b\S+\.(com|it|net|org|io|app|exec|php|html)\b\S*/gi, '');
  t = t.replace(/\b[\w-]+\.(jpg|jpeg|png|webp|gif|mp4|mov|avi|mp3|wav)\b/gi, '');
  t = t.replace(/<[^>]+>/g, ' ');
  t = t.replace(/[_#\\/|@{}<>[\]~^`+*=]/g, ' ');
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}

function riproduciTTSGalleria(idx) {
  var ta = document.getElementById('testo-' + idx);
  var testoRaw = ta ? ta.value : (_galleriaAllItems[idx] ? _galleriaAllItems[idx].testo : '');
  var testo = pulisciTestoPerOratoreBrowser(testoRaw);
  if (!testo || testo === '(nessun testo)') { alert('Nessun testo da leggere.'); return; }
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(testo);
    utter.lang = 'it-IT'; utter.rate = 0.93; utter.pitch = 1.0;
    var voices = window.speechSynthesis.getVoices();
    var itVoice = voices.find(function(v) { return v.lang.indexOf('it') === 0; });
    if (itVoice) utter.voice = itVoice;
    window.speechSynthesis.speak(utter);
  } else alert('TTS non supportato in questo browser.');
}

function convertiUrlDriveDirectJS(url) {
  if (!url || typeof url !== 'string') return '';
  url = url.trim();
  if (url.indexOf('lh3.googleusercontent.com') !== -1 || url.indexOf('drive.google.com/uc') !== -1) {
    return url;
  }
  var match = url.match(/\/d\/([^\/\?]+)/) || url.match(/id=([^\&]+)/);
  if (match && match[1]) {
    return 'https://lh3.googleusercontent.com/d/' + match[1];
  }
  return url;
}

  }

function aggiornaFiltriCanvas() {
  var canvas = document.getElementById('editor-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!_editorImgObj || !_editorImgObj.complete || !_editorImgObj.naturalWidth) return;

  var b = document.getElementById('slider-brightness') ? document.getElementById('slider-brightness').value : 100;
  var c = document.getElementById('slider-contrast') ? document.getElementById('slider-contrast').value : 100;
  var s = document.getElementById('slider-saturation') ? document.getElementById('slider-saturation').value : 100;

  var vb = document.getElementById('val-brightness'); if (vb) vb.innerText = b + '%';
  var vc = document.getElementById('val-contrast'); if (vc) vc.innerText = c + '%';
  var vs = document.getElementById('val-saturation'); if (vs) vs.innerText = s + '%';

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.filter = 'brightness(' + b + '%) contrast(' + c + '%) saturate(' + s + ')';
  ctx.drawImage(_editorImgObj, 0, 0);
  ctx.filter = 'none';

  var chkMask = document.getElementById('chk-enable-mask');
  var maskEnabled = chkMask ? chkMask.checked : false;
  if (maskEnabled) {
    var posX = ((document.getElementById('slider-mask-x') ? document.getElementById('slider-mask-x').value : 50) / 100) * canvas.width;
    var posY = ((document.getElementById('slider-mask-y') ? document.getElementById('slider-mask-y').value : 50) / 100) * canvas.height;
    var size = parseInt((document.getElementById('slider-mask-size') ? document.getElementById('slider-mask-size').value : 80), 10) * (canvas.width / 1000);
    var opacity = (document.getElementById('slider-mask-opacity') ? document.getElementById('slider-mask-opacity').value : 100) / 100;

    var mx = document.getElementById('val-mask-x'); if (mx) mx.innerText = (document.getElementById('slider-mask-x') ? document.getElementById('slider-mask-x').value : 50) + '%';
    var my = document.getElementById('val-mask-y'); if (my) my.innerText = (document.getElementById('slider-mask-y') ? document.getElementById('slider-mask-y').value : 50) + '%';
    var ms = document.getElementById('val-mask-size'); if (ms) ms.innerText = Math.round(size) + 'px';
    var mo = document.getElementById('val-mask-opacity'); if (mo) mo.innerText = (document.getElementById('slider-mask-opacity') ? document.getElementById('slider-mask-opacity').value : 100) + '%';

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(posX, posY, size, 0, 2 * Math.PI);
    ctx.fill();
    ctx.restore();
  }

  var chkLogo = document.getElementById('chk-enable-logo');
  var logoEnabled = chkLogo ? chkLogo.checked : true;
  if (logoEnabled) {
    disegnaWatermarkODecorazione(ctx, canvas.width, canvas.height, _currentEditingType);
  }
}

function disegnaWatermarkODecorazione(ctx, width, height, tipoMedia) {
  var chkLogo = document.getElementById('chk-enable-logo');
  var logoEnabled = chkLogo ? chkLogo.checked : true;
  if (!logoEnabled) return;

  var selPosEl = document.getElementById('editor-logo-position');
  var posizione = selPosEl ? selPosEl.value : (_currentEditingType === '360' ? '360_nadir' : 'centrale_semitrasparente');
  if (posizione === 'nessuno') return;

  var logo = _cachedLogoImg && _cachedLogoImg.complete && _cachedLogoImg.naturalWidth ? _cachedLogoImg : null;

  var eseguiRenderLogo = function(lImg) {
    ctx.save();
    var logoW = width * 0.20;
    var logoH = (lImg.height / lImg.width) * logoW;
    var margin = width * 0.03;

    if (posizione === '360_nadir') {
      var radius = width * 0.08;
      var centerX = width / 2;
      var centerY = height - (radius * 0.85);

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.fill();

      var lw = radius * 1.4;
      var lh = (lImg.height / lImg.width) * lw;
      ctx.drawImage(lImg, centerX - (lw / 2), centerY - (lh / 2), lw, lh);

    } else if (posizione === 'in_basso_destra') {
      ctx.globalAlpha = 0.85;
      ctx.drawImage(lImg, width - logoW - margin, height - logoH - margin, logoW, logoH);
    } else if (posizione === 'in_basso_sinistra') {
      ctx.globalAlpha = 0.85;
      ctx.drawImage(lImg, margin, height - logoH - margin, logoW, logoH);
    } else if (posizione === 'in_alto_destra') {
      ctx.globalAlpha = 0.85;
      ctx.drawImage(lImg, width - logoW - margin, margin, logoW, logoH);
    } else if (posizione === 'in_alto_sinistra') {
      ctx.globalAlpha = 0.85;
      ctx.drawImage(lImg, margin, margin, logoW, logoH);
    } else { // centrale_semitrasparente
      var cW = width * 0.30;
      var cH = (lImg.height / lImg.width) * cW;
      ctx.globalAlpha = 0.40;
      ctx.drawImage(lImg, (width - cW) / 2, (height - cH) / 2, cW, cH);
    }

    ctx.restore();
  };

  if (logo) {
    eseguiRenderLogo(logo);
  } else {
    var newLogo = new Image();
    newLogo.crossOrigin = "anonymous";
    newLogo.onload = function() {
      _cachedLogoImg = newLogo;
      eseguiRenderLogo(newLogo);
    };
    newLogo.src = LOGO_GIANCANI_URL;
  }
}

    statusMsg.style.display = 'block';
    statusMsg.style.color = 'var(--gold-bright)';
    statusMsg.innerHTML = '⏳ Invio richiesta a GitHub Actions per rendering video 9:16 (FFmpeg) ed invio email...';
  }

  var payload = {
    tabName: tabName,
    riga: 2,
    testoF: testoF,
    musicaDriveId: musicaId,
    email: emailDest
  };

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) btn.disabled = false;
        if (res && res.success) {
          if (statusMsg) {
            statusMsg.style.color = '#2ecc71';
            statusMsg.innerHTML = '✅ <strong>Richiesta inviata con successo!</strong><br>' + res.msg;
          }
          alert('🎬 GENERAZIONE REEL AVVIATA!

La richiesta è stata inoltrata a GitHub Actions.
Riceverai il video montato (con box scuro al 60% e musica) con il copy pronto direttamente via email su:
' + emailDest + '

— Immobiliare Giancani');
          setTimeout(chiudiModalGeneraReelStudio, 2000);
        } else {
          if (statusMsg) {
            statusMsg.style.color = '#e74c3c';
            statusMsg.innerHTML = '❌ ' + (res ? res.error : 'Errore sconosciuto');
          }
        }
      })
      .withFailureHandler(function(err) {
        if (btn) btn.disabled = false;
        var errStr = (err && err.message) ? err.message : String(err);
        if (statusMsg) {
          statusMsg.style.color = '#e74c3c';
          statusMsg.innerHTML = '❌ Errore chiamata: ' + errStr;
        }
      })
      .avviaGenerazioneReelDaGalleria(payload);
  } else {
    setTimeout(function() {
      if (btn) btn.disabled = false;
      if (statusMsg) {
        statusMsg.style.color = '#2ecc71';
        statusMsg.innerHTML = '✅ Mock: Workflow avviato con successo!';
      }
    }, 1000);
  }
}

setTimeout(function() {
  try { caricaBasiMusicaliStudioGalleria(); } catch(e) {}
}, 2000);

name: Serverless Multistream Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video o della Web App'
        required: true
      fb_key:
        description: 'Facebook RTMP URL completo'
        required: false
      yt_key:
        description: 'YouTube Stream Key o URL RTMP completo'
        required: false
      tk_key:
        description: 'TikTok RTMP URL completo'
        required: false
      ig_key:
        description: 'Instagram RTMP URL completo'
        required: false

jobs:
  multistream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Headless Environment and Audio Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb openbox pulseaudio pulseaudio-utils alsa-utils
          
          # Installa Google Chrome stabile
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          google-chrome --version
          ffmpeg -version | head -1

      - name: Launch Audio Engine, Browser and Start Multistream
        run: |
          # 1. Configura ALSA per PulseAudio
          mkdir -p ~/.config/pulse
          echo 'pcm.!default { type pulse }' > ~/.asoundrc
          echo 'ctl.!default { type pulse }' >> ~/.asoundrc

          # 2. Avvia PulseAudio
          pulseaudio -D --exit-idle-time=-1 --system=false || true
          sleep 2
          
          # 3. Sink Virtuale per Audio Browser
          pactl load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink || true
          pactl set-default-sink VirtualSink || true

          export DISPLAY=:99

          # 4. Server X virtuale 1920x1080
          Xvfb :99 -screen 0 1920x1080x24 &
          openbox &
          sleep 2

          mkdir -p /tmp/chrome_clean_profile
          touch "/tmp/chrome_clean_profile/First Run"

          echo "Avvio Chrome sulla pagina: ${{ github.event.inputs.video_url }}"
          google-chrome \
            --kiosk \
            --window-position=0,0 \
            --window-size=1920,1080 \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-first-run-ui \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-restore-session-state \
            --disable-notifications \
            --disable-features=AudioServiceOutOfProcess \
            --enable-features=UsePulseAudio \
            --autoplay-policy=no-user-gesture-required \
            --user-data-dir=/tmp/chrome_clean_profile \
            "${{ github.event.inputs.video_url }}" &
          
          echo "Attesa di 15 secondi per il caricamento della pagina..."
          sleep 15

          PIDS=()

          # --- 1. STREAM FACEBOOK LIVE ---
          if [ -n "${{ github.event.inputs.fb_key }}" ]; then
            echo "Avvio stream Facebook Live..."
            ffmpeg -thread_queue_size 1024 -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
                   -thread_queue_size 1024 -f pulse -i VirtualSink.monitor \
                   -vf "crop=1920:1030:0:50,scale=1920:1080" \
                   -c:v libx264 -preset veryfast -b:v 2800k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60 \
                   -c:a aac -b:a 128k -ar 44100 \
                   -flvflags no_duration_filesize -f flv "${{ github.event.inputs.fb_key }}" &
            PIDS+=($!)
          fi

          # --- 2. STREAM YOUTUBE LIVE (Supporto Chiave Diretta & RTMP Ingestion) ---
          YT_KEY="${{ github.event.inputs.yt_key }}"
          if [ -n "$YT_KEY" ]; then
            YT_URL=""
            if [[ "$YT_KEY" == rtmp* ]]; then
              YT_URL="$YT_KEY"
            else
              YT_URL="rtmp://a.rtmp.youtube.com/live2/$YT_KEY"
            fi
            echo "Avvio stream YouTube Live su: $YT_URL"
            ffmpeg -thread_queue_size 1024 -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
                   -thread_queue_size 1024 -f pulse -i VirtualSink.monitor \
                   -vf "crop=1920:1030:0:50,scale=1920:1080" \
                   -c:v libx264 -preset veryfast -b:v 2800k -maxrate 3200k -bufsize 6000k -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
                   -c:a aac -b:a 128k -ar 44100 \
                   -flvflags no_duration_filesize -f flv "$YT_URL" &
            PIDS+=($!)
          fi

          # --- 3. STREAM TIKTOK ---
          if [ -n "${{ github.event.inputs.tk_key }}" ]; then
            echo "Avvio stream TikTok..."
            ffmpeg -thread_queue_size 1024 -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
                   -thread_queue_size 1024 -f pulse -i VirtualSink.monitor \
                   -vf "crop=1920:1030:0:50,scale=1920:1080" \
                   -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2800k -bufsize 5000k -pix_fmt yuv420p -g 60 \
                   -c:a aac -b:a 128k -ar 44100 \
                   -flvflags no_duration_filesize -f flv "${{ github.event.inputs.tk_key }}" &
            PIDS+=($!)
          fi

          # --- 4. STREAM INSTAGRAM ---
          if [ -n "${{ github.event.inputs.ig_key }}" ]; then
            echo "Avvio stream Instagram..."
            ffmpeg -thread_queue_size 1024 -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
                   -thread_queue_size 1024 -f pulse -i VirtualSink.monitor \
                   -vf "crop=1920:1030:0:50,scale=1920:1080" \
                   -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2800k -bufsize 5000k -pix_fmt yuv420p -g 60 \
                   -c:a aac -b:a 128k -ar 44100 \
                   -flvflags no_duration_filesize -f flv "${{ github.event.inputs.ig_key }}" &
            PIDS+=($!)
          fi

          if [ ${#PIDS[@]} -eq 0 ]; then
            echo "Nessuna chiave di streaming valida fornita!"
            exit 1
          fi

          echo "Streaming live in corso su tutti i canali attivi..."
          wait "${PIDS[@]}"
          echo "Stream terminati."

name: Storie YouTube Quotidiane (07:00 & 19:00)

on:
  schedule:
    # Esegue alle 07:00 e alle 19:00 ora italiana (Europe/Rome)
    # Copre sia orario estivo CEST (UTC+2 -> 05:00 e 17:00 UTC) sia invernale CET (UTC+1 -> 06:00 e 18:00 UTC)
    - cron: '0 5,6,17,18 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Seleziona modalità video (auto = rotazione dinamica anti-ripetizione, random = casuale, cycle = sequenziale, first, last)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - random
          - cycle
          - first
          - last
      publish_feed:
        description: 'Pubblica anche come post nel feed/bacheca di Facebook? (default: false, solo Storie)'
        required: false
        default: false
        type: boolean

jobs:
  pubblica-storia-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir pillow numpy yt-dlp requests

      - name: Verifica Finestra Oraria (07:00 & 19:00 Europe/Rome)
        id: time_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_now=true" >> $GITHUB_OUTPUT
          else
            HOUR_ROME=$(TZ="Europe/Rome" date +"%H")
            H=$((10#$HOUR_ROME))
            if [ "$H" -eq 7 ] || [ "$H" -eq 19 ]; then
              echo "run_now=true" >> $GITHUB_OUTPUT
              echo "Orario Europe/Rome valido: $HOUR_ROME:00. Procedo con la storia YouTube."
            else
              echo "run_now=false" >> $GITHUB_OUTPUT
              echo "Orario Europe/Rome non attivo: $HOUR_ROME:00 (attivo alle 07:00 e 19:00)."
            fi
          fi

      - name: Esegui Pubblicazione Storia YouTube
        if: steps.time_check.outputs.run_now == 'true'
        run: |
          TARGET_MODE="${{ github.event.inputs.target }}"
          if [ -z "$TARGET_MODE" ]; then TARGET_MODE="auto"; fi
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.publish_feed }}" = "true" ]; then
            EXTRA_FLAGS="--publish-feed"
          fi
          python3 scripts/bot_storie_youtube.py --target "$TARGET_MODE" $EXTRA_FLAGS

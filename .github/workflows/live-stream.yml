name: Serverless Multistream Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video o della Web App'
        required: true
      fb_key:
        description: 'Facebook RTMP URL completo'
        required: false
      yt_key:
        description: 'YouTube Stream Key'
        required: false
      tk_key:
        description: 'TikTok RTMP URL completo'
        required: false
      ig_key:
        description: 'Instagram RTMP URL completo'
        required: false

jobs:
  multistream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Headless Environment and Audio Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb openbox pulseaudio pulseaudio-utils alsa-utils
          
          # Installa Google Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          google-chrome --version
          ffmpeg -version | head -1

      - name: Launch Audio Engine, Browser and Start Multistream
        run: |
          # 1. Configura ALSA per reindirizzare a PulseAudio
          mkdir -p ~/.config/pulse
          cat << 'EOF' > ~/.asoundrc
pcm.!default {
    type pulse
}
ctl.!default {
    type pulse
}
EOF

          # 2. Avvia PulseAudio daemon in background
          pulseaudio -D --exit-idle-time=-1 --system=false || true
          sleep 2
          
          # 3. Crea il Sink Virtuale per l'audio del Browser (Musica di Sottofondo + Voci TTS)
          pactl load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink || true
          pactl set-default-sink VirtualSink || true

          export DISPLAY=:99

          # 4. Avvia il server X virtuale a 1920x1080
          Xvfb :99 -screen 0 1920x1080x24 &
          
          # 5. Avvia Openbox per gestire la finestra a tutto schermo pulita
          openbox &
          sleep 2

          # 6. Pre-crea la cartella profilo ed evita la schermata "First Run"
          mkdir -p /tmp/chrome_clean_profile
          touch "/tmp/chrome_clean_profile/First Run"

          echo "Avvio Chrome con sblocco Audio TTS e Musica sulla pagina: ${{ github.event.inputs.video_url }}"
          google-chrome \
            --kiosk \
            --window-position=0,0 \
            --window-size=1920,1080 \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-first-run-ui \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-restore-session-state \
            --disable-notifications \
            --disable-features=AudioServiceOutOfProcess \
            --enable-features=UsePulseAudio \
            --autoplay-policy=no-user-gesture-required \
            --user-data-dir=/tmp/chrome_clean_profile \
            "${{ github.event.inputs.video_url }}" &
          
          echo "Attesa di 15 secondi per il caricamento completo della pagina e l'avvio delle Voci TTS..."
          sleep 15

          PIDS=()

          # -f pulse -i VirtualSink.monitor cattura sia la musica sia le 2 voci TTS prodotte da Chrome!
          if [ -n "${{ github.event.inputs.fb_key }}" ]; then
            echo "Avvio stream Facebook (Video HD + Audio Musica & Voci TTS)..."
            ffmpeg -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
                   -f pulse -i VirtualSink.monitor \
                   -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60 \
                   -c:a aac -b:a 128k -ar 44100 \
                   -f flv "${{ github.event.inputs.fb_key }}" &
            PIDS+=($!)
          fi

          if [ -n "${{ github.event.inputs.yt_key }}" ]; then
            echo "Avvio stream YouTube (Video HD + Audio Musica & Voci TTS)..."
            ffmpeg -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
                   -f pulse -i VirtualSink.monitor \
                   -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60 \
                   -c:a aac -b:a 128k -ar 44100 \
                   -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.yt_key }}" &
            PIDS+=($!)
          fi

          if [ ${#PIDS[@]} -eq 0 ]; then
            echo "Nessuna chiave di streaming fornita!"
            exit 1
          fi

          echo "Tutti gli stream attivi con Audio TTS & Musica (PIDs: ${PIDS[*]}). In attesa..."
          wait "${PIDS[@]}"
          echo "Stream terminati."

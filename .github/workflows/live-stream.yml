name: Serverless Multistream Live
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video o della Web App'
        required: true
      fb_key:
        description: 'Facebook RTMP URL completo'
        required: false
      yt_key:
        description: 'YouTube Stream Key o URL RTMP completo'
        required: false
      tk_key:
        description: 'TikTok RTMP URL completo'
        required: false
      ig_key:
        description: 'Instagram RTMP URL completo'
        required: false
      duration_hours:
        description: 'Durata massima della diretta in ore'
        required: false
        default: '6'
      stream_quality:
        description: 'Qualità stream (1080p_high, 1080p_std, 1080p_eco, 720p_hq, 720p_std, 720p_eco, 480p, custom)'
        required: false
        default: '1080p_std'
      scale_factor:
        description: 'Scala Device Chrome (1.0 = Desktop 1:5, 1.25 = Zoom)'
        required: false
        default: '1.5'
      custom_bitrate:
        description: 'Bitrate FFmpeg personalizzato (es. 4000k)'
        required: false
        default: '4500k'
      custom_res:
        description: 'Risoluzione personalizzata (es. 1920:1080)'
        required: false
        default: '1920:1080'
jobs:
  multistream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Headless Environment and Audio Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb openbox pulseaudio pulseaudio-utils alsa-utils jq curl fonts-dejavu-core espeak-ng speech-dispatcher libespeak-ng1
          # Installa Google Chrome stabile
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version
          ffmpeg -version | head -1
      - name: Setup Playwright and Headless Automation Engines
        run: |
          npm init -y
          npm install playwright
          npx playwright install-deps
          npx playwright install chromium
          python3 -m pip install --no-cache-dir playwright requests pillow numpy edge-tts yt-dlp
      - name: Launch Audio Engine, Browser and Start Multistream
        run: |
          # 1. Configura PulseAudio con socket UNIX esplicito
          mkdir -p /tmp/pulse-config
          cat << 'EOF' > /tmp/pulse.pa
          load-module module-native-protocol-unix socket=/tmp/pulse-socket
          load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink
          set-default-sink VirtualSink
          EOF

          pulseaudio -D --exit-idle-time=-1 -F /tmp/pulse.pa || true
          sleep 2

          export PULSE_SERVER=unix:/tmp/pulse-socket
          export DISPLAY=:99

          # Configura ALSA per reindirizzare a PulseAudio
          cat << 'EOF' > ~/.asoundrc
          pcm.!default {
              type pulse
          }
          ctl.!default {
              type pulse
          }
          EOF

          # 2. Server X virtuale 1920x1080
          Xvfb :99 -screen 0 1920x1080x24 &
          openbox &
          sleep 2

          # 3. Avvia Microservizio Locale Edge TTS per DarIA e DarIO (Porta 5050)
          echo "Avvio microservizio Edge TTS locale su porta 5050..."
          python3 scripts/tts_server.py &
          sleep 3
          curl -s http://127.0.0.1:5050/health && echo " -> TTS Server OK!" || echo " -> Avviso TTS Server"
          # 5. CREA ESTENSIONE CHROME ANTI-BANNER GOOGLE APPS SCRIPT
          # Rimuove qualsiasi disclaimer "Questa applicazione è stata creata da un altro utente"
          mkdir -p /tmp/hide_banner_ext
          cat << 'EOF' > /tmp/hide_banner_ext/manifest.json
          {
          "manifest_version": 3,
          "name": "Hide Apps Script Banner",
          "version": "1.0",
          "content_scripts": [
          {
          "matches": ["*://script.google.com/*", "*://script.googleusercontent.com/*"],
          "css": ["style.css"],
          "js": ["content.js"],
          "run_at": "document_start"
          }
          ]
          }
          EOF
          cat << 'EOF' > /tmp/hide_banner_ext/style.css
          #warning,
          .warning-bar,
          #warning-bar-table tr:first-child,
          #warning-bar-table > tbody > tr:first-child,
          .docs-butter-bar-container,
          div[aria-label*="Apps Script"],
          .app-bar,
          #guest-banner {
          display: none !important;
          height: 0px !important;
          max-height: 0px !important;
          min-height: 0px !important;
          padding: 0 !important;
          margin: 0 !important;
          border: 0 !important;
          overflow: hidden !important;
          visibility: hidden !important;
          }
          #warning-bar-table,
          #warning-bar-table > tbody,
          #warning-bar-table > tbody > tr:last-child,
          #warning-bar-table > tbody > tr:last-child > td,
          #sandboxFrame {
          height: 100% !important;
          width: 100% !important;
          min-height: 100vh !important;
          min-width: 100vw !important;
          border: none !important;
          padding: 0 !important;
          margin: 0 !important;
          }
          html, body {
          overflow: hidden !important;
          margin: 0 !important;
          padding: 0 !important;
          height: 100% !important;
          width: 100% !important;
          }
          EOF
          cat << 'EOF' > /tmp/hide_banner_ext/content.js
          (function() {
          function removeBanner() {
          var w = document.getElementById('warning');
          if (w) {
          w.style.setProperty('display', 'none', 'important');
          if (w.parentElement && w.parentElement.parentElement) {
          w.parentElement.parentElement.style.setProperty('display', 'none', 'important');
          }
          }
          var tbl = document.getElementById('warning-bar-table');
          if (tbl) {
          var rows = tbl.querySelectorAll('tr');
          if (rows.length > 1) {
          rows[0].style.setProperty('display', 'none', 'important');
          }
          }
          var iframe = document.getElementById('sandboxFrame');
          if (iframe) {
          iframe.style.setProperty('height', '100vh', 'important');
          iframe.style.setProperty('width', '100vw', 'important');
          iframe.style.setProperty('border', 'none', 'important');
          }
          }
          removeBanner();
          document.addEventListener('DOMContentLoaded', removeBanner);
          window.addEventListener('load', removeBanner);
          setInterval(removeBanner, 300);
          })();
          EOF
          mkdir -p /tmp/chrome_clean_profile
          touch "/tmp/chrome_clean_profile/First Run"
          SCALE_FACTOR="${{ github.event.inputs.scale_factor }}"
          if [ -z "$SCALE_FACTOR" ]; then SCALE_FACTOR="1.5"; fi
          echo "Avvio Chrome con Scala $SCALE_FACTOR e Anti-Banner su: ${{ github.event.inputs.video_url }}"
          google-chrome             --kiosk             --window-position=0,0             --window-size=1920,1080             --force-device-scale-factor=$SCALE_FACTOR             --load-extension=/tmp/hide_banner_ext             --disable-extensions-except=/tmp/hide_banner_ext             --remote-debugging-port=9222             --enable-webgl             --ignore-gpu-blocklist             --use-gl=swiftshader             --disable-web-security             --allow-running-insecure-content             --no-sandbox             --no-first-run             --no-default-browser-check             --disable-first-run-ui             --disable-infobars             --disable-session-crashed-bubble             --disable-restore-session-state             --disable-notifications             --disable-features=AudioServiceOutOfProcess             --enable-features=UsePulseAudio             --autoplay-policy=no-user-gesture-required             --alsa-output-device=pulse             --user-data-dir=/tmp/chrome_clean_profile             "${{ github.event.inputs.video_url }}" &
          echo "Attesa di 15 secondi per il caricamento della pagina..."
          sleep 15
          echo "Verifica sink inputs PulseAudio (Chrome Audio Output):"
          pactl list sink-inputs || true
          # 6. Costruzione destinazioni con TEE Muxer e onfail=ignore (Fault-Tolerant)
          # --- 0. AUTOMAZIONE HEADLESS PER INSTAGRAM & TIKTOK ---
          if [ -z "${{ github.event.inputs.ig_key }}" ] && [ -f scripts/instagram_live_auto.js ]; then
            echo "📸 Avvio automazione headless Instagram Live..."
            node scripts/instagram_live_auto.js &
            sleep 5
          fi
          if [ -z "${{ github.event.inputs.tk_key }}" ] && [ -f scripts/tiktok_live_adapter.js ]; then
            echo "🎵 Avvio automazione headless TikTok Live Adapter..."
            node scripts/tiktok_live_adapter.js &
            sleep 8
          fi
          TEE_DESTS=()
          # --- 1. FACEBOOK LIVE ---
          FB_KEY="${{ github.event.inputs.fb_key }}"
          if [ -z "$FB_KEY" ]; then
            FB_KEY="FB-1761836115505207-0-Ab4NotixqCElXbBE4ynoHVYe"
          fi
          FB_URL=""
          if [[ "$FB_KEY" == rtmp* ]]; then
            FB_URL="$FB_KEY"
          else
            FB_URL="rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
          fi
          echo "📘 Output configurato: Facebook Live ($FB_URL)"
          TEE_DESTS+=("[f=flv:onfail=ignore]${FB_URL}")
          # --- 2. YOUTUBE LIVE ---
          YT_KEY="${{ github.event.inputs.yt_key }}"
          if [ -z "$YT_KEY" ]; then
            YT_KEY="umqe-k4ke-qba4-39db-abrp"
          fi
          YT_URL=""
          if [[ "$YT_KEY" == rtmp* ]]; then
            YT_URL="$YT_KEY"
          else
            YT_URL="rtmp://a.rtmp.youtube.com/live2/$YT_KEY"
          fi
          echo "▶ Output configurato: YouTube Live ($YT_URL)"
          TEE_DESTS+=("[f=flv:onfail=ignore]${YT_URL}")
          # Seconda YT key rimossa (era scaduta/non necessaria)
          # --- 3. TIKTOK LIVE ---
          TK_KEY="${{ github.event.inputs.tk_key }}"
          if [ -z "$TK_KEY" ] && [ -f /tmp/tiktok_rtmp.txt ]; then
            TK_KEY=$(cat /tmp/tiktok_rtmp.txt | tr -d '\r\n')
            echo "🎵 Endpoint TikTok RTMP recuperato da adapter: $TK_KEY"
          fi
          if [ -n "$TK_KEY" ]; then
            TK_URL=""
            if [[ "$TK_KEY" == rtmp* ]]; then
              TK_URL="$TK_KEY"
            else
              TK_URL="rtmp://live-push.tiktok-cdns.com/live/$TK_KEY"
            fi
            echo "🎵 Output configurato: TikTok Live ($TK_URL)"
            TEE_DESTS+=("[f=flv:onfail=ignore]${TK_URL}")
          fi
          # --- 4. INSTAGRAM LIVE ---
          IG_KEY="${{ github.event.inputs.ig_key }}"
          if [ -z "$IG_KEY" ] && [ -f /tmp/instagram_rtmp.txt ]; then
            IG_KEY=$(cat /tmp/instagram_rtmp.txt | tr -d '\r\n')
            echo "📸 Endpoint Instagram RTMP recuperato da adapter: $IG_KEY"
          fi
          if [ -n "$IG_KEY" ]; then
            IG_URL=""
            if [[ "$IG_KEY" == rtmp* ]]; then
              IG_URL="$IG_KEY"
            else
              IG_URL="rtmps://live-upload.instagram.com:443/rtmp/$IG_KEY"
            fi
            echo "📸 Output configurato: Instagram Live ($IG_URL)"
            TEE_DESTS+=("[f=flv:onfail=ignore]${IG_URL}")
          fi
          if [ ${#TEE_DESTS[@]} -eq 0 ]; then
            echo "❌ Errore: Nessuna chiave o destinazione RTMP fornita!"
            exit 1
          fi
          # Unione delle destinazioni separate dal carattere pipe '|'
          IFS="|"
          TEE_STRING="${TEE_DESTS[*]}"
          DUR_HOURS="${{ github.event.inputs.duration_hours }}"
          if [ -z "$DUR_HOURS" ]; then
            DUR_HOURS="6"
          fi
          DUR_SECS=$(awk "BEGIN {print int($DUR_HOURS * 3600)}")
          echo "⏱️ Durata programmata dello streaming: $DUR_HOURS ore ($DUR_SECS secondi)"
          QUALITY="${{ github.event.inputs.stream_quality }}"
          if [ -z "$QUALITY" ]; then QUALITY="1080p_std"; fi
          if [ "$QUALITY" = "1080p_high" ]; then
            BITRATE="6000k"; MINRATE="5000k"; MAXRATE="6500k"; BUFSIZE="12000k"; VF="scale=1920:1080:flags=lanczos"
          elif [ "$QUALITY" = "1080p_eco" ]; then
            BITRATE="3500k"; MINRATE="3000k"; MAXRATE="4000k"; BUFSIZE="7000k"; VF="scale=1920:1080:flags=bicubic"
          elif [ "$QUALITY" = "720p_hq" ]; then
            BITRATE="3000k"; MINRATE="2600k"; MAXRATE="3400k"; BUFSIZE="6000k"; VF="scale=1280:720:flags=bicubic"
          elif [ "$QUALITY" = "720p_std" ]; then
            BITRATE="2200k"; MINRATE="1800k"; MAXRATE="2600k"; BUFSIZE="4400k"; VF="scale=1280:720:flags=bicubic"
          elif [ "$QUALITY" = "720p_eco" ]; then
            BITRATE="1600k"; MINRATE="1300k"; MAXRATE="2000k"; BUFSIZE="3200k"; VF="scale=1280:720:flags=bicubic"
          elif [ "$QUALITY" = "480p" ]; then
            BITRATE="1000k"; MINRATE="800k"; MAXRATE="1200k"; BUFSIZE="2000k"; VF="scale=854:480:flags=bicubic"
          elif [ "$QUALITY" = "custom" ]; then
            CUSTOM_BITRATE="${{ github.event.inputs.custom_bitrate }}"
            if [ -z "$CUSTOM_BITRATE" ]; then CUSTOM_BITRATE="4000k"; fi
            CUSTOM_RES="${{ github.event.inputs.custom_res }}"
            if [ -z "$CUSTOM_RES" ]; then CUSTOM_RES="1920:1080"; fi
            BITRATE="$CUSTOM_BITRATE"; MINRATE="$CUSTOM_BITRATE"; MAXRATE="$CUSTOM_BITRATE"; BUFSIZE="8000k"; VF="scale=$CUSTOM_RES:flags=bicubic"
          else
            # Default 1080p Standard
            BITRATE="4500k"; MINRATE="4000k"; MAXRATE="5000k"; BUFSIZE="9000k"; VF="scale=1920:1080:flags=lanczos"
          fi
          echo "🚀 Configurazione FFmpeg applicata: Qualità=$QUALITY, Bitrate=$BITRATE, Filtro=$VF"
          # --- 7. BACKGROUND STORIES DAEMON (OGNI 10 MINUTI ED ESCLUSIVAMENTE IN LIVE) ---
          echo "📱 Avvio demone Storie Facebook in diretta ogni 10 minuti..."
          python3 scripts/pubblica_storia_facebook.py --mode live --loop --interval 600 &
          echo "🎥 Avvio encoding FFmpeg CBR $BITRATE ($QUALITY) con TEE Muxer e Timer di $DUR_HOURS ore..."
          timeout --kill-after=30s "${DUR_SECS}s" ffmpeg -thread_queue_size 2048 \
            -f x11grab -draw_mouse 0 -video_size 1920x1080 -framerate 30 -i :99 \
            -thread_queue_size 2048 \
            -f pulse -i VirtualSink.monitor \
            -vf "$VF" \
            -c:v libx264 -preset veryfast \
            -b:v $BITRATE -minrate $MINRATE -maxrate $MAXRATE -bufsize $BUFSIZE \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 160k -ar 44100 -ac 2 \
            -vsync cfr \
            -flags +global_header \
            -f tee -map 0:v -map 1:a "$TEE_STRING" || true
          echo "Stream terminato regolarmente dopo $DUR_HOURS ore."

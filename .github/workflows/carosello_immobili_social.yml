name: Carosello Post & Storie Immobili (Lunedì, Mercoledì, Venerdì 18:30)

on:
  schedule:
    # Esegue Lunedì, Mercoledì e Venerdì in orario preserale (18:30 Europe/Rome)
    # Copre CEST (UTC+2 -> 16:30 UTC) e CET (UTC+1 -> 17:30 UTC)
    - cron: '30 16,17 * * 1,3,5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza la pubblicazione anche se c'è già un post oggi (ignora salta-giorno)?'
        required: false
        default: false
        type: boolean
      immobile:
        description: 'Nome del foglio immobile specifico (opzionale, es. Villa_Favara)'
        required: false
        default: ''
        type: string

jobs:
  carosello-immobili-social:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir pillow numpy requests

      - name: Verifica Orario Preserale (Filtro Finestra 18:00 - 19:30 Europe/Rome)
        id: time_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_now=true" >> $GITHUB_OUTPUT
          else
            HOUR_ROME=$(TZ="Europe/Rome" date +"%H")
            if [ "$HOUR_ROME" -eq 18 ]; then
              echo "run_now=true" >> $GITHUB_OUTPUT
            else
              echo "run_now=false" >> $GITHUB_OUTPUT
              echo "Orario attuale Europe/Rome: $HOUR_ROME:00. Uscita dallo slot duplicato (attivo solo alle 18:30)."
            fi
          fi

      - name: Esegui Bot Carosello Immobili Social
        if: steps.time_check.outputs.run_now == 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.immobile }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --immobile ${{ github.event.inputs.immobile }}"
          fi
          python3 scripts/bot_carosello_immobili_social.py $EXTRA_ARGS

      - name: Salva Storico Pubblicazioni nel Repository
        if: steps.time_check.outputs.run_now == 'true'
        run: |
          git config --global user.name "Giancani Social Bot"
          git config --global user.email "bot@immobiliaregiancani.it"
          if [ -f "immobili_pubblicati_history.json" ]; then
            git add immobili_pubblicati_history.json
            git commit -m "chore: aggiorna storico pubblicazioni carosello [skip ci]" || echo "Nessuna modifica allo storico"
            git push || echo "Push non necessario o non autorizzato"
          fi
